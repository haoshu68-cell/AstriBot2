<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AstriBot 搬运仿真演示</title><style>*{box-sizing:border-box}body{margin:0;background:#101618;color:#edf1ec;font:16px system-ui;padding:32px;max-width:1480px;margin:auto}small{color:#8cc9b3;letter-spacing:2px}h1{font-size:30px;font-weight:550;margin:10px 0}p{color:#b9c7c6;line-height:1.7}img,video{width:100%;border:1px solid #304548;border-radius:14px;background:#202a2d}nav{display:flex;gap:12px;margin:22px 0}button:disabled{opacity:.5;cursor:wait}button{background:#243c3e;color:#e8f5f0;border:1px solid #46686a;border-radius:8px;padding:10px 18px;cursor:pointer}#note{color:#8ee3bb}</style><small>ASTRIBOT · ACTUAL GAZEBO SIMULATION</small><h1>机器人抓取 → 搬运 → 放置</h1><p>全景摄像机与头部 RGB 画面来自运行中的仿真。顶部显示实时任务阶段。</p><nav><button onclick="live()">实时画面</button><button id="replayButton" onclick="replay()" disabled>录像生成中</button></nav><p id="note">实时画面每秒刷新；右下角为抓取视觉输入。</p><img id="screen" src="transport_raw.jpg"><video id="video" controls hidden src="transport_demo.mp4"></video><p>当前验证：运动学附着、MoveIt 规划与 ROS 控制。未验证夹持力、接触摩擦或真机参数。</p><script>const video=document.getElementById('video'),note=document.getElementById('note');let timer;const readyCheck=setInterval(async()=>{try{const r=await fetch('transport_demo.mp4',{method:'HEAD',cache:'no-store'});if(r.ok){const b=document.getElementById('replayButton');b.disabled=false;b.textContent='完整录像';clearInterval(readyCheck)}}catch(e){}},3000);function live(){video.pause();video.hidden=true;document.getElementById('screen').hidden=false;note.textContent='实时画面每秒刷新；右下角为抓取视觉输入。';clearInterval(timer);timer=setInterval(()=>document.getElementById('screen').src='transport_raw.jpg?t='+Date.now(),1000)}function replay(){clearInterval(timer);document.getElementById('screen').hidden=true;video.hidden=false;video.load();note.textContent='实际仿真录像，可暂停、拖动和全屏。';video.play().catch(()=>{})}live();</script></html>
