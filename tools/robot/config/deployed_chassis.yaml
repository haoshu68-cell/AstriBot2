chassis_cmd_bridge:
  ros__parameters:
    use_sim_time: false
    declared_target: real
    allow_write_to_real: true
    start_disabled: true
    pose_source: slam
    input_frame: body
    enable_slam_correction: false
    require_slam_to_enable: true
    require_fresh_scan: true
    cmd_vel_topic: /cmd_vel
    scan_topic: /scan_from_cloud
    odom_topic: /astribot/chassis/odom_from_sdk
    leash_xy_m: 0.25
    leash_theta_rad: 0.35

arm_traj_bridge:
  ros__parameters:
    use_sim_time: false
    declared_target: real
    allow_write_to_real: false
    enable_waypoints_service: false
    gripper.enable_service: false
