    global_frame: odom
    robot_base_frame: astribot_torso_base
    transform_tolerance: 0.1
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: astribot_torso_base
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 1.0, 2.0]
    min_velocity: [-1.0, -1.0, -2.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    speed_limit_topic: "/speed_limit"

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: astribot_torso_base
      use_sim_time: True
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # !!! 实测踩坑记录 !!!：MPPI 的 CostCritic/ObstaclesCritic 设了
      # consider_footprint:true 时会调用 costmap 的"足迹多边形"接口，只给
      # robot_radius(不给显式footprint) 时这个接口在controller_server启动的那次
      # 生命周期transition里报"no robot footprint provided in the costmap"直接FATAL退出。
      # 改成显式给一个多边形footprint，问题消失——这是 nav2_costmap_2d 在
      # "只给radius不给footprint"这条路径下的一个实测发现的真实限制，不是配置错误。
      #
      # 注：两个 critic 都是 consider_footprint:true，所以上面那条 FATAL 路径**仍然有效**，
      # 显式 footprint 是必需的，别删。
      # （曾试过把 critic 改成 false，实测无收益已回退；见文件末尾。
      #   即便将来再改成 false，footprint 也仍有三个使用者：膨胀层据此算内切/外接半径、
      #   behavior_server 的 published_footprint、全局规划器的可通行性判定。）
      #
      # !!! 足迹是正方形 a=0.31（半边长）。2026-09-07 从八边形 R=0.42 换过来 !!!
      # 换的理由是**八边形在轴向虚报 120mm**，不是为了放松安全余量：
      #   底盘真实包络（URDF 实测）：X 型布局，四个轮子在 ±45° 对角线上，
      #     轮心离轴 0.306 + 轮球半径 0.080 ⇒ 对角方向 0.386；
      #     轴向没有轮子，只有躯干圆柱 0.300。
      #   八边形 R=0.42：轴向 0.420 vs 真实 0.300 —— 虚报 120mm。
      #   正方形 a=0.31：轴向 0.310 vs 0.300（余量 10mm）、
      #                  对角 0.438 vs 0.386（余量 52mm）。
      # 逐 0.01° 扫过 0~90°，正方形对真实底盘的**最小**余量 = +10mm（在轴向），
      # 即任何朝向都包住底盘 —— 是诚实包络，不是缩小。另有 footprint_padding
      # 默认 0.01 再叠 10mm。（原来的 0.35 圆偏小，会规划出蹭到障碍的路径。）
      #
      # 连带口径（改这个数之前先看这两行）：
      #   内切半径 0.388 -> 0.310（膨胀层的致死带按内切半径算，跟着缩 78mm）
      #   外接半径 0.420 -> 0.438（inflation_radius 0.65 仍大于它，不触发启动 ERROR）
      # 两个 costmap 必须逐字一致，test_config_consistency 会强制。
      footprint: "[[0.31, 0.31], [-0.31, 0.31], [-0.31, -0.31], [0.31, -0.31]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # !!! 原值 0.25 比足迹外接半径还小，Nav2 每次启动都在报 ERROR：
        #   "The configured inflation radius (0.250) is smaller than the robot radius (0.35)"
        # 后果是膨胀层连机器人自身轮廓都覆盖不住，规划器拿不到"离墙远一点"的代价梯度，
        # 路径会紧贴障碍物走。inflation_radius 必须大于足迹外接半径(正方形 a=0.31 ⇒ 0.438)。
        #
        # 取 0.65 后的代价梯度（内切半径 0.310、cost_scaling_factor 3.0，
        # 按 nav2 InflationLayer::computeCost 逐字算，含截尾）：
        #   离障碍 <=0.31m -> 253  (内切带内，底盘中心放这里必然碰撞)
        #   离障碍 0.35m  -> 223
        #   离障碍 0.39m  -> 199
        #   离障碍 0.42m  -> 181   (刚好轮缘擦到)
        #   离障碍 0.50m  -> 142
        #   离障碍 0.60m  -> 105
        #   离障碍 >0.65m -> 0     (自由通行)
        # ⚠️ 2026-09-07 换正方形足迹后这张表整体下移：内切从 0.388 缩到 0.310，
        #    253 那一档跟着缩 78mm，0.35~0.39 这一段从"致命"变成"高代价"。
        # 注意膨胀代价只在内切半径以内才是致死值，所以放大 inflation_radius
        # 不会把窄通道变成不可通行，只是让规划器更偏向走通道中间。
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
          # ═══════ expected_update_rate：不设它等于关掉陈旧检测 ═══════
          # nav2 默认 0.0 的含义是 ObservationBuffer::isCurrent() **永远返回 true**，
          # 即 /scan 无论多旧 costmap 都认为是新的、一条告警都不打。
          # 实测事故（2026-09-01 21:26 急停）：/scan 掉到 0.56Hz、龄期 2.03s，
          # 而 nav2 全程照常规划、照常发速度、零告警。
          #
          # !!! 这是告警，不是联锁 !!! controller_server 二进制里没有任何检查
          # costmap currency 的字符串，陈旧时它仍会继续发速度。真正的拒绝下发在
          # chassis_cmd_bridge 的 /scan 联锁里，别指望这一条。
          #
          # 0.2s = 两个雷达帧周期(10Hz)。健康态实测 9.9~10.04Hz，
          # 取 0.1 会因抖一帧就误报，0.2 容一帧抖动又远小于危险的秒级陈旧。
          #
          # !!! 这一条原先只加在 nav2_params_rpp.yaml 里 !!!
          # 于是 controller_plugin:=mppi 一切换，陈旧检测就**静默消失** ——
          # 2026-09-02 用探针读活节点才发现两个 costmap 都是 0.0。
          # TestObservationStalenessDetection 现在会强制两份文件保持一致。
          expected_update_rate: 0.2
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: astribot_torso_base
      use_sim_time: True
      footprint: "[[0.31, 0.31], [-0.31, 0.31], [-0.31, -0.31], [0.31, -0.31]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
          # 与 local_costmap 同一条理由，见上面那段长注释。
          # 全局图也要设：它的 obstacle_layer 用的是同一个 /scan，
          # 陈旧时全局规划同样是在旧障碍上规划，而同样不会有任何报错。
          expected_update_rate: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # !!! 原值 0.25 比足迹外接半径还小，Nav2 每次启动都在报 ERROR：
        #   "The configured inflation radius (0.250) is smaller than the robot radius (0.35)"
        # 后果是膨胀层连机器人自身轮廓都覆盖不住，规划器拿不到"离墙远一点"的代价梯度，
        # 路径会紧贴障碍物走。inflation_radius 必须大于足迹外接半径(正方形 a=0.31 ⇒ 0.438)。
        #
        # ======================================================================
        # 需求：(1) 全局路径尽可能居中；(2) **不要为抄近道去钻窄通道**，
        #      宁可绕远走宽阔大路。
        #
        # 规划器怎么算（nav2 humble node_2d.cpp 源码逐字确认，非推测）：
        #     getTraversalCost = 步长 x (1.0 + cost_travel_multiplier * cost/252)
        #     getHeuristicCost = 纯欧氏距离，**不含代价项**
        # 所以它最小化「几何长度 x 代价惩罚因子」，
        # 窄通道被选中的条件是：窄路长 x 惩罚因子 < 宽路长。
        #
        # !!! 根因：宽于 2 x inflation_radius 的通道，中心代价恒为 0 !!!
        # inflation_radius 0.75 时 2m 通道中心距墙 1.0m > 0.75m ⇒ 代价 0
        # ⇒ 惩罚因子 1.000 ⇒ 那条 2m 窄道在规划器眼里和 4m 大路**一样便宜**，
        # A* 只剩「谁短走谁」，于是必走窄通道。
        # 这不是权重不够大，是**信息不存在** —— cost_travel_multiplier 再大，
        # 乘的都是 0。（与 MPPI 那个「足迹代价饱和 253、梯度为 0」是同一类错误
        # 的镜像：一边饱和到顶、一边饱和到底，两边都没梯度。）
        #
        # 判据：inflation_radius >= (想惩罚的最窄通道宽度) / 2。
        # 需求口径 2m ⇒ 取 1.0；cost_travel_multiplier 取 8.0
        # （2m 通道原始代价 40.2 只有 1.5m 通道 85.1 的一半，权重要跟上才有区分度）。
        #
        # 取 1.0 + 8.0 后（本文件几何：正方形 a=0.31，内切半径 0.310）：
        #    1.5m 通道 -> 中心代价  67.0 -> 惩罚因子 3.127 -> 容忍绕路 3.13x
        #    2.0m 通道 -> 中心代价  31.0 -> 惩罚因子 1.984 -> 容忍绕路 1.98x
        # ⚠️ 2026-09-07 换正方形足迹前这两行是 85.1/3.70x 与 40.2/2.28x
        #    （内切 0.388）。窄通道惩罚随内切半径变小而**变弱** —— 这是换足迹的
        #    连带代价，如实记下：2m 通道的容忍绕路从 2.28x 降到 1.98x。
        #    2.5m 通道 -> 中心代价   0.0 -> 惩罚因子 1.000 -> 容忍绕路 1.00x
        #    3.0m 通道 -> 中心代价   0.0 -> 惩罚因子 1.000 -> 容忍绕路 1.00x
        #    4.0m 通道 -> 中心代价   0.0 -> 惩罚因子 1.000 -> 容忍绕路 1.00x
        #   「容忍绕路 Nx」= 宽路必须比窄路长 N 倍，规划器才肯放弃窄路。
        #
        # 取值含义要说清楚：inflation_radius 取多大，就等于宣告
        # 「比这更宽的通道我一律视为同等优良」。取 1.0 时 2.5m 与 4m 大路
        # 无法区分（都是 0）。若要连 2.5m 也轻微惩罚需取 1.25。
        #
        # 253(不可通行) 那一档由内切半径 0.310 决定、与 inflation_radius 无关，
        # 所以本改动**不缩小可行域**，只塑造梯度形状。
        #
        # 只改**全局**这一份：局部代价地图维持 0.65 不变。局部图被 MPPI 的
        # ObstaclesCritic/CostCritic 读取，抬高它会改变已验证的跟踪行为。
        # 判据固化在 test_config_consistency.py::TestGlobalPathCentering。
        # ======================================================================
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: True

