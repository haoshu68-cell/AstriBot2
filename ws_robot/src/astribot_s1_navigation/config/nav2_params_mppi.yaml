            consider_footprint: true
            collision_cost: 1000000.0
            near_goal_distance: 1.0
          PathAlignCritic:
            enabled: true
            cost_power: 1
            cost_weight: 14.0
            max_path_occupancy_ratio: 0.05
            trajectory_point_step: 4
            threshold_to_consider: 0.5
            offset_from_furthest: 20
          PathFollowCritic:
            enabled: true
            cost_power: 1
            cost_weight: 5.0
            offset_from_furthest: 5
            threshold_to_consider: 1.4
          PathAngleCritic:
            enabled: true
            cost_power: 1
            cost_weight: 2.0
            offset_from_furthest: 4
            threshold_to_consider: 0.5
            max_angle_to_furthest: 1.0
          TwirlingCritic:
            enabled: true
            twirling_cost_power: 1
            twirling_cost_weight: 10.0
          ObstaclesCritic:
            enabled: true
            cost_power: 1
            repulsion_weight: 1.5
            critical_weight: 20.0
            # 保持 true，理由同 CostCritic（试过 false，无可测收益，已回退）。
            consider_footprint: true
            collision_cost: 1000000.0
            # !!! 0.10 -> 0.05：这一条**没有**跟着 consider_footprint 一起回退 !!!
            # 它的依据独立于 consider_footprint，且不涉及那条
            # "Inconsistent configuration in collision checking" 告警（那是 false 才有的）。
            #
            # 这是「足迹边缘到障碍」的重罚带宽度，带内吃 critical_weight=20 的重罚。
            # 实测本仓库地图（全局 costmap 快照，280x416）：
            #   center-clearance ∈ [0.05,0.10) 的位置占可行域 6.71%（物理通道宽 0.88~0.98m）
            #   center-clearance <  0.05       的位置占可行域 0.00%
            # 即 0.10 恰好把**所有**真实窄通道罚了个遍，而 0.05 一个不罚 ——
            # 这个阈值正好落在本地图窄通道分布的断层上，不是随手取的。
            #
            # 安全性不靠这个参数兜底：真碰撞由 254 判定（consider_footprint:true 下
            # 253 不算碰撞），且八边形足迹本身已有 34mm 余量
            # （顶点 0.42 vs URDF 实测真实轮缘包络 0.386）。
            #
            # !!! 但要注意：这条改动同样**没有**实测收益证据 !!!
            # 三个已验证可达目标上改前改后都是 3/3 SUCCEEDED、0 次
