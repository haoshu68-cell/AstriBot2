# Nav2 参数文件（controller_plugin=mppi：MPPI + Smac2D，推荐配置）。
#
# MPPI (Model Predictive Path Integral) 原生支持 holonomic 全向运动模型
# （motion_model: "Omni"），能真正利用本机器人全向轮的全向平移能力（斜着直接走，
# 不需要先转向），比 nav2_params_rpp.yaml 里的 RPP 更适合这个机器人——推荐实际部署用
# 这一份，rpp 只是为了满足任务书字面要求保留的默认值。除 controller_server 外，
# 其它 server(planner/behavior/bt_navigator/waypoint_follower/velocity_smoother/
# 两个costmap) 与 nav2_params_rpp.yaml 完全一致，复用同样的坐标系/速度限制/代价地图
# 配置，这里不重复展开注释，详见 nav2_params_rpp.yaml 对应段落。

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      # 全向底盘特有：vy_std 非零才能让 MPPI 真正采样横向平移轨迹。
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 1.0
      vx_min: -1.0
      # 全向底盘特有：vy_max 非零，配合下面 motion_model: "Omni"。
      vy_max: 1.0
      wz_max: 2.0
      ax_max: 2.5
      ax_min: -2.5
      ay_max: 2.5
      az_max: 3.2
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      # !!! 关键参数 !!!：motion_model 必须是 "Omni"（全向），不是 MPPI 默认示例常见的
      # "DiffDrive"——设成 DiffDrive 的话 MPPI 也会跟 RPP 一样退化成"先转向再前进"，
      # 白白浪费全向轮的全向能力。
      motion_model: "Omni"
      visualize: false
      reset_period: 1.0
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
        "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
        "PreferForwardCritic", "ObstaclesCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # 全向底盘不强制"必须朝前走"，权重比典型差速车配置调低一些，允许侧移/斜移。
        cost_weight: 2.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # 保持 true。曾改成 false 试图解决窄通道走不动，实测**无可测收益**后回退，
        # 详见本文件末尾「窄通道通行能力：一次未能证实的尝试」。
        # 那一节记录的「足迹代价在 <1.62m 通道里饱和成 253」是实测硬数据，
        # 将来真在窄通道里卡住时可以直接接着查，不用重来一轮。
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        # 保持 true，理由同 CostCritic（试过 false，无可测收益，已回退）。
        consider_footprint: true
        collision_cost: 1000000.0
        # !!! 0.10 -> 0.05：这一条**没有**跟着 consider_footprint 一起回退 !!!
        # 它的依据独立于 consider_footprint，且不涉及那条
        # "Inconsistent configuration in collision checking" 告警（那是 false 才有的）。
        #
        # 这是「足迹边缘到障碍」的重罚带宽度，带内吃 critical_weight=20 的重罚。
        # 实测本仓库地图（全局 costmap 快照，280x416）：
        #   center-clearance ∈ [0.05,0.10) 的位置占可行域 6.71%（物理通道宽 0.88~0.98m）
        #   center-clearance <  0.05       的位置占可行域 0.00%
        # 即 0.10 恰好把**所有**真实窄通道罚了个遍，而 0.05 一个不罚 ——
        # 这个阈值正好落在本地图窄通道分布的断层上，不是随手取的。
        #
        # 安全性不靠这个参数兜底：真碰撞由 254 判定（consider_footprint:true 下
        # 253 不算碰撞），且八边形足迹本身已有 34mm 余量
        # （顶点 0.42 vs URDF 实测真实轮缘包络 0.386）。
        #
        # !!! 但要注意：这条改动同样**没有**实测收益证据 !!!
        # 三个已验证可达目标上改前改后都是 3/3 SUCCEEDED、0 次
        # "Failed to make progress"，差异在单次运行噪声内。保留它是因为
        # 「罚遍所有窄通道」这个事实独立成立、且风险面比 consider_footprint 小，
        # 但它仍属**待评估**状态，不是已验证的优化。
        # 单独立项要做的事见文件末尾「待评估：collision_margin_distance」。
        collision_margin_distance: 0.05
        near_goal_distance: 0.5

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      # 未知区域禁行：全局规划器不得把未知栅格纳入路径。
      # 原来是 true —— 那会让 SmacPlanner2D 直接穿过没扫过的区域「抄近道」，
      # 与探索协调器的「未知区绝对禁行」冲突：协调器会把这种路径整条否掉，
      # 于是候选一个个被拒、探索原地打转。
      # 改成 false 后规划器自己就不会产生这种路径，两层约束方向一致。
      # 代价：探索初期已知区很小，可达目标也少；这是刻意的保守取向。
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: astribot_torso_base
    transform_tolerance: 0.1
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: astribot_torso_base
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 1.0, 2.0]
    min_velocity: [-1.0, -1.0, -2.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    speed_limit_topic: "/speed_limit"

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: astribot_torso_base
      use_sim_time: True
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # !!! 实测踩坑记录 !!!：MPPI 的 CostCritic/ObstaclesCritic 设了
      # consider_footprint:true 时会调用 costmap 的"足迹多边形"接口，只给
      # robot_radius(不给显式footprint) 时这个接口在controller_server启动的那次
      # 生命周期transition里报"no robot footprint provided in the costmap"直接FATAL退出。
      # 改成显式给一个八边形footprint，问题消失——这是 nav2_costmap_2d 在
      # "只给radius不给footprint"这条路径下的一个实测发现的真实限制，不是配置错误。
      #
      # 注：两个 critic 都是 consider_footprint:true，所以上面那条 FATAL 路径**仍然有效**，
      # 显式 footprint 是必需的，别删。
      # （曾试过把 critic 改成 false，实测无收益已回退；见文件末尾。
      #   即便将来再改成 false，footprint 也仍有三个使用者：膨胀层据此算内切/外接半径、
      #   behavior_server 的 published_footprint、全局规划器的可通行性判定。）
      #
      # !!! 足迹尺寸按真实底盘几何重算过（原来的 0.35 偏小，会规划出蹭到障碍的路径）!!!
      # 从 URDF 实测：轮心离轴 0.306m + 轮球半径 0.080m => 底盘真实外接半径 0.386m。
      # 关键点：本底盘是 X 型布局，四个轮子正好在 ±45° 对角线上，
      # 也就是八边形的**顶点方向**——原配置在这个方向只有 0.35，比轮缘小 36mm，
      # 等于告诉 Nav2「机器人比实际更小」，代价地图算出来的可通行区域偏大，
      # 于是规划出的路径会让轮子蹭上货架立柱。
      # 现在取外接半径 0.42：顶点 0.42 > 轮缘 0.386（余量 34mm）；
      # 顶点之间凹陷处的内切半径 0.388 > 躯干圆柱 0.30，也够。
      footprint: "[[0.42, 0.0], [0.297, 0.297], [0.0, 0.42], [-0.297, 0.297], [-0.42, 0.0], [-0.297, -0.297], [0.0, -0.42], [0.297, -0.297]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # !!! 原值 0.25 比足迹外接半径还小，Nav2 每次启动都在报 ERROR：
        #   "The configured inflation radius (0.250) is smaller than the robot radius (0.35)"
        # 后果是膨胀层连机器人自身轮廓都覆盖不住，规划器拿不到"离墙远一点"的代价梯度，
        # 路径会紧贴障碍物走。inflation_radius 必须大于足迹外接半径(0.42)。
        #
        # 取 0.65 后的代价梯度（内切半径 0.388、cost_scaling_factor 3.0）：
        #   离障碍 0.42m -> 229   (刚好轮缘擦到，重罚)
        #   离障碍 0.50m -> 180
        #   离障碍 0.60m -> 133
        #   离障碍 >0.65m -> 0    (自由通行)
        # 注意膨胀代价只在内切半径以内才是致死值，所以放大 inflation_radius
        # 不会把窄通道变成不可通行，只是让规划器更偏向走通道中间。
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: astribot_torso_base
      use_sim_time: True
      footprint: "[[0.42, 0.0], [0.297, 0.297], [0.0, 0.42], [-0.297, 0.297], [-0.42, 0.0], [-0.297, -0.297], [0.0, -0.42], [0.297, -0.297]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # !!! 原值 0.25 比足迹外接半径还小，Nav2 每次启动都在报 ERROR：
        #   "The configured inflation radius (0.250) is smaller than the robot radius (0.35)"
        # 后果是膨胀层连机器人自身轮廓都覆盖不住，规划器拿不到"离墙远一点"的代价梯度，
        # 路径会紧贴障碍物走。inflation_radius 必须大于足迹外接半径(0.42)。
        #
        # 取 0.65 后的代价梯度（内切半径 0.388、cost_scaling_factor 3.0）：
        #   离障碍 0.42m -> 229   (刚好轮缘擦到，重罚)
        #   离障碍 0.50m -> 180
        #   离障碍 0.60m -> 133
        #   离障碍 >0.65m -> 0    (自由通行)
        # 注意膨胀代价只在内切半径以内才是致死值，所以放大 inflation_radius
        # 不会把窄通道变成不可通行，只是让规划器更偏向走通道中间。
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      always_send_full_costmap: True

# =============================================================================
# 窄通道通行能力：一次未能证实的尝试（2026-08-24）
#
# 结论先写：**改动已回退，没有证据表明 consider_footprint:false 能提升窄通道通行能力。**
# 保留本节是因为里面那组采样数据是实测的硬数据，将来真在窄通道里卡住时
# 可以直接接着往下查，不必重来一轮。
#
# ---- 站得住的实测发现（数据可复现）----
#
# consider_footprint:true 时 ObstaclesCritic/CostCritic 用 footprintCostAtPose 的
# **最大值**打分。沿一条通道每 0.1m 采样 13 个点：
#     位移      足迹最大代价     中心格代价
#     0.0m         253            0
#     0.3m         253            0
#     0.4m         253          118
#     1.0m         253          134
#     1.2m         253          137
#   足迹最大代价取值集合 = [253]                  → 完全饱和，零梯度
#   中心格代价    取值集合 = [0,118,125,134,137]   → 有梯度
#
# 为什么必然饱和（纯几何，与具体位置无关）：
#   · 253(INSCRIBED_INFLATED_OBSTACLE) 区域从墙面向内吃掉一个**内切半径** 0.388m
#   · 八边形足迹顶点伸到**外接半径** 0.42m
#   → 通道窄于 2*(0.388+0.42) = 1.62m 时，足迹顶点必然压在 253 带里，
#     footprintCostAtPose 恒返回 253，由它反推的 dist_to_obj 成为常数，
#     critical/repulsion 两项对所有候选轨迹完全相同 → 评价函数在该区域失去梯度。
#   实测本地图 center-clearance < 0.42m 的区域约占可行域 35%。
#
# ---- 为什么说「未能证实」----
#
# 改成 false 后做了对照（只重启 controller_server，Gazebo/地图/起点全不变，
# 起点相差 <=0.08m；配置差异用 "Inconsistent configuration in collision checking"
# 告警条数核实：true 时 0 条、false 时 2 条）：
#
#   目标(map)        改前 true/0.10          改后 false/0.05
#   (1.39, 6.03)     SUCCEEDED 5.8s 误差0.131  SUCCEEDED 5.6s 误差0.067
#   (0.24, 5.41)     SUCCEEDED 6.4s 误差0.188  SUCCEEDED 6.5s 误差0.224
#   (-0.14, 7.32)    SUCCEEDED 5.7s 误差0.100  SUCCEEDED 5.4s 误差0.066
#   Failed to make progress   0                        0
#   控制环掉周期              0                        0
#
# 三个目标改前改后都 3/3 成功，差异在单次运行噪声内（N=1 每点）。
# 更关键的是：**改前也一次没触发 Failed to make progress**，说明这三条路径
# 根本没进入上面那个退化区，这组对照压根没测到要测的东西。
#
# 而在这张地图上构造不出能测到的用例：实测所有「宽敞区之间」的最紧必经瓶颈是
# center-clearance 0.150m（物理宽 1.08m），真正的窄处（0.05~0.10m，占可行域 6.71%）
# **永远可以绕开**。也就是说这张图里没有任何目标会强制机器人挤窄通道。
#
# ---- 下次要验证该怎么做 ----
#   1. 先构造强制窄口（在开阔处摆两个箱子形成可控宽度的唯一通路），
#      以「最小可通行宽度」为指标扫宽度，才有分辨力
#   2. 或者换一张本身就有强制窄通道的地图
#   3. 测试脚本务必注意（这轮踩过的坑，都会把结果搞成假的）：
#      · 节点要 use_sim_time=True，否则墙钟时间戳配仿真时钟 TF，
#        planner_server 报 "Could not transform the start or goal pose"，
#        全局路径压根没生成，测出来的「走不动」是脚本自己造成的
#      · 目标用 map 系 + stamp=0（"用最新可用变换"），绕开整类时钟/变换问题
#      · action 状态码：4=SUCCEEDED 5=CANCELED **6=ABORTED**，
#        把 6 读成 CANCELED 会把「Nav2 主动放弃」误判成「脚本超时」
#      · 目标必须先用 ComputePathToPose 验证可达，否则失败来自全局规划而非局部规划
#
# ---- 另一个被实测反证的方案，别再试 ----
# 曾打算调大 BT 的 BackUp 参数（默认 backup_dist=0.30m，看着像"小于内切半径
# 0.388m 所以退不出致命区"）。实测沿 BackUp 方向（车体 -x）后退 0.40m
# 反而**撞进 253**——那个方向是朝墙的。调大 backup_dist 只会把机器人推得更深。
