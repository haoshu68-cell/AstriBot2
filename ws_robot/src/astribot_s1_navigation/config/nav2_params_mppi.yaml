            threshold_to_consider: 0.5
            max_angle_to_furthest: 1.0
          TwirlingCritic:
            enabled: true
            twirling_cost_power: 1
            # 路线A：原值 10.0。罚 mean|wz| 会压制 DiffDrive 下必需的转向；
            # 反汇编确认它在非全向模型下不会自动失效，必须显式降权。
            twirling_cost_weight: 1.0
          # ═══ 曲率-速度耦合限速（本仓库自研，思路来自社区 PR AngularVelocitySpeedLimitCritic）═══
          # 判据只有一条恒等式：a_lat = v*|wz| = kappa*v^2，要求 <= a_lat_max，
          # 等价于 v <= sqrt(a_lat_max / kappa) —— 后者就是 vx = f(kappa) 那条耦合曲线。
          # 项1（反馈）罚 rollout 自身 v*|wz| 的超出量；项2（前馈）从前方路径最大 Menger
          # 曲率算速度上限再罚超出量。"入弯**前**就减速"只能来自项2：一条"保持高速、
          # 先不转"的 rollout |wz|≈0，反馈项对它毫无读数，而它恰是过弯冲出去的那条。
          # 完整推导 / 与其他 critic 的关系，见
          #   astribot_s1_path_tracking/include/astribot_s1_path_tracking/curvature_speed_limit_critic.hpp
          # 它罚的是 v*|wz|，**低速转弯代价恒为 0**，所以不会重现 TwirlingCritic 10.0
          # 压制对齐的那个问题，也不是把 Twirling 调回 10.0 的替代品（两者不要一起加）。
          CurvatureSpeedLimitCritic:
            enabled: true
            # 幂次取 2：越限越狠，而软带内仍近线性、梯度温和。
            cost_power: 2
            # 项1 权重。超出量已归一化到 a_lat_max，量纲无关，可跨速度档位/机型迁移。
            cost_weight: 6.0
            # 项2 权重（单位 m/s，未归一化）。置 0 = 退化成社区 PR 的纯反馈行为。
            path_cost_weight: 8.0
            path_lookahead_dist: 1.5
            # 终段让位给 GoalCritic 与接近段限速，否则两层限速串联叠乘把终段拖成龟速。
            threshold_to_consider: 0.5
            # ⚠ 侧向加速度的**物理上界 = vx_max * wz_max**，而 navigation.launch.py 会把
            #   vx_max 重写成 max_linear_speed。按轴 0.2 档位下上界只有 0.2*2.0 = 0.4，
            #   惩罚触发要 |wz| > 1.05 ⇒ kappa > 5.25 (R < 0.19m)，全局路径不会有这种曲率
            #   ⇒ **该档位下本 critic 近似空操作**。这是物理事实不是 bug：0.2m/s 绕 R=1m
            #   只需 0.04 m/s^2 侧向加速度，本来就不该限速。推论：若 0.2 档位下仍出现
            #   大曲率跟踪失败，根因不在动力学，而在 PathAngleCritic 的 ±57.3° 航向死区。
            #   收益在解除限速跑 vx_max=1.0 时显现：上界 2.0，从 kappa>0.21 (R<4.8m) 起咬，
            #   R=1m 处限到 0.458 m/s（-54%）。
            #   a_lat_max >= 上界时 initialize() 会打 WARN 明说"恒为空操作"（否则它会静默无效，
            #   而 nav2 只打一条 "Critic loaded"，不会告诉你它不起作用）。
            # ⚠ 本值是**待实测标定项**，验收看大曲率处 v 与 wz 的实测联合分布，不是这个数字本身。
            a_lat_max: 0.35
            # 软带起点 = soft_ratio * a_lat_max = 0.21 m/s^2。它存在的唯一理由是避免零梯度区：
            # 硬 hinge 在未越限时代价恒 0，MPPI 无法给"还没越限但已经很快"的样本排序。
            # 本仓库已两次栽在零梯度上（足迹代价在窄通道饱和成 253 / 全局 costmap 恒为 0）。
            # 等价地 v_soft / v_hard = sqrt(soft_ratio)。取 1.0 退化成硬 hinge，不推荐。
            soft_ratio: 0.6
            # 过弯速度地板：防极大曲率处把允许速度算到 0 而彻底不动。
            v_min_turn: 0.08
            # v_max 刻意**没有**这个键 —— 它取父控制器的 vx_max，因此自动跟着
            # max_linear_speed 走。同一物理量在 yaml 里出现两次一定会漂开。
          ObstaclesCritic:
            enabled: true
            cost_power: 1
            repulsion_weight: 1.5
            critical_weight: 20.0
            # 保持 true，理由同 CostCritic（试过 false，无可测收益，已回退）。
            consider_footprint: true
            collision_cost: 1000000.0
            # !!! 0.10 -> 0.05：这一条**没有**跟着 consider_footprint 一起回退 !!!
            # 它的依据独立于 consider_footprint，且不涉及那条
            # "Inconsistent configuration in collision checking" 告警（那是 false 才有的）。
            #
            # 这是「足迹边缘到障碍」的重罚带宽度，带内吃 critical_weight=20 的重罚。
            # 实测本仓库地图（全局 costmap 快照，280x416）：
            #   center-clearance ∈ [0.05,0.10) 的位置占可行域 6.71%（物理通道宽 0.88~0.98m）
            #   center-clearance <  0.05       的位置占可行域 0.00%
            # 即 0.10 恰好把**所有**真实窄通道罚了个遍，而 0.05 一个不罚 ——
            # 这个阈值正好落在本地图窄通道分布的断层上，不是随手取的。
            #
            # 安全性不靠这个参数兜底：真碰撞由 254 判定（consider_footprint:true 下
            # 253 不算碰撞），且足迹本身对真实底盘留有余量。
            # ⚠️ 2026-09-07 换正方形足迹后这个余量**变薄了**，如实记下：
            #    八边形 R=0.42 的最小余量 34mm（对角：顶点 0.42 vs 真实轮缘 0.386）；
            #    正方形 a=0.31 的最小余量 10mm（轴向：0.310 vs 躯干圆柱 0.300），
            #    对角方向反而更宽（0.438 vs 0.386，余量 52mm）。
            #    另有 footprint_padding 默认 0.01 再叠 10mm ⇒ 有效最小余量 20mm。
            #
            # !!! 但要注意：这条改动同样**没有**实测收益证据 !!!
            # 三个已验证可达目标上改前改后都是 3/3 SUCCEEDED、0 次
            # "Failed to make progress"，差异在单次运行噪声内。保留它是因为
            # 「罚遍所有窄通道」这个事实独立成立、且风险面比 consider_footprint 小，
            # 但它仍属**待评估**状态，不是已验证的优化。
            # 单独立项要做的事见文件末尾「待评估：collision_margin_distance」。
            collision_margin_distance: 0.05
            near_goal_distance: 0.5

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      # 🔴 必须 <= controller_server 的 xy_goal_tolerance(0.18)。
      #
      # 这是规划器"允许把路径终点放在目标多远处仍算成功"的容差。它大于到位容差
      # 时，规划器会交付一条**它认为合格、而 goal checker 永远不满足**的路径：
      #   实测 tolerance=0.5 时 B(1.04,-6.12) -> A(5.88,-5.86) 的路径终点是
      #   (5.47,-5.82)，离目标 0.41m —— 正好落在 (0.18, 0.50) 这个区间里。
      #   机器人走完全程也进不了 0.18m，于是 goal checker 不满足 -> 无限重规划
      #   -> 200s 超时。10 段循环导航里"去 A"方向 5/5 全超时、机器人一步没离开
      #   起点，而"回 B"5/5 报成功（它本来就在 B，不动就满足容差）——
      #   真实往返成功率是 0/10，却有一半的段显示 SUCCEEDED。
      #
      # 这与窄通道策略无关：那 5 次缩足迹切换都是在这个死循环里被反复触发的，
      # 曾被误读成"策略进不去"。
      #
      # 取 0.15 而不是 0.18：留一格余量(分辨率 0.05)，避免规划器踩在判据边界上。
      # 目标本身落在膨胀带(实测 A 点代价 216)时仍然可达 —— 规划器只避 253/254，
      # 216 是可通行的衰减值。
      # 🔴 必须 <= xy_goal_tolerance(0.18) 且留一格(0.05)余量 ⇒ 上限 0.13。
      # 取 0.10。规划器 tolerance 比到位容差**松**时，它会交付一条终点
      # 落在到位容差之外的路径，goal checker 永远收不了 —— 表现是
      # "控制器说本段完成、BT 却一直重规划、action 永不返回"。
      # 2026-09-03 实测过这个组合：tolerance 0.5 时交付的路径终点距目标
      # 0.409m，而 xy_goal_tolerance 只有 0.18m，真实成功率 0/10，
      # 当时被误读成"窄通道策略进不去"。
      # 收紧的代价是**目标不可达时显式失败**而不是悄悄交一条短路径 ——
      # 这正是想要的：不可达要报出来，不能假装到位。
      tolerance: 0.10
      downsample_costmap: false
      downsampling_factor: 1
      # 未知区域禁行：全局规划器不得把未知栅格纳入路径。
      # 原来是 true —— 那会让 SmacPlanner2D 直接穿过没扫过的区域「抄近道」，
      # 与探索协调器的「未知区绝对禁行」冲突：协调器会把这种路径整条否掉，
      # 于是候选一个个被拒、探索原地打转。
      # 改成 false 后规划器自己就不会产生这种路径，两层约束方向一致。
      # 代价：探索初期已知区很小，可达目标也少；这是刻意的保守取向。
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # 「代价」相对「路径长度」的权重。仅有梯度不够 —— 权重太低时规划器仍会
      # 为了抄近道而贴边（梯度存在但便宜）。配合 global inflation_radius 0.75
      # 一起才构成「尽可能居中」：0.75 提供梯度，这一项决定规划器多在意它。
      # 2.0 -> 4.0 属于待实测标定项，验收看的是路径点到墙的实测距离，
      # 不是这个数字本身。
      cost_travel_multiplier: 8.0
      use_final_approach_orientation: false

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
