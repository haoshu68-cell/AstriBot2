# Nav2 参数文件（controller_plugin=mppi：MPPI + Smac2D，推荐配置）。
#
# MPPI (Model Predictive Path Integral) 原生支持 holonomic 全向运动模型，比
# nav2_params_rpp.yaml 里的 RPP 更适合这个机器人——推荐实际部署用这一份，rpp 只是
# 为了满足任务书字面要求保留的默认值。
#
# ⚠2026-09-03「路线A」：三处 MPPI 块的运动模型已从 "Omni" 改成 "DiffDrive"
# （vy_max/vy_std 一并置 0，twirling_cost_weight 10.0->1.0，两处
# zero_vy_in_follow false->true）。原因：Omni 下机头是自由变量——PathAlignCritic
# (14.0) 只约束位置，横移就能满足它，PathAngleCritic 的 ±57.3° 是死区，
# TwirlingCritic(10.0) 还在压制转向，于是机器人蟹行。要"机头沿路径"就得把横向
# 自由度从模型层去掉，而不是继续加航向权重。run11 基线（平移中 n=9679）：
# 机头−切向 中位 9.25° / P90 44.33° / P99 63.77°，尾部压在 57.3° 死区边界上。
# 一键回退：把上述五处改回注释里标注的原值即可，不需要改代码。
# ⚠️ 2026-09-07 删掉窄通道贴边接管层之后，**再没有任何一层保留横移能力**：
#    原先那一层自己算指令并在内层之前 return，是 vy 的唯一出口。现在
#    DiffDrive + vy_max/vy_std=0 + zero_vy_in_follow 三处一致地把 vy 归零，
#    底盘物理上仍是全向的，但整条控制链不再使用横移。
#
# 除 controller_server 外，其它 server(planner/behavior/bt_navigator/
# waypoint_follower/velocity_smoother/两个costmap) 与 nav2_params_rpp.yaml
# 完全一致，复用同样的坐标系/速度限制/代价地图配置，这里不重复展开注释，
# 详见 nav2_params_rpp.yaml 对应段落。

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    # !!! 只能列一个 !!! Nav2 规则：goal_checker_plugins 只有一项时它自动成为默认；
    # 列两项就必须由调用方通过 FollowPath 的 goal_checker_id 指定，而默认 BT 传的是
    # 空字符串 -> controller_server 每次 FollowPath 直接 abort：
    #   FollowPath called with goal_checker name "" ... which does not exist.
    # 症状是「机器人完全不跟踪路径 + 反复 spin/backup」，而汇总日志里只看到
    # 「Nav2 中止(无法规划或控制失败)」—— 真因只出现在
    # ~/.ros/log/controller_server_*.log 里。
    # 回退档 loose_goal_checker 定义保留在下面，但**不要**加进这个列表。
    goal_checker_plugins: ["general_goal_checker"]
    # FollowPath 必须留在列表里且保持这个名字：FollowPath 行为树节点的
    # controller_id 端口默认就是 "FollowPath"，默认 BT 会用它。
    #
    # 🔴 2026-09-07：**FollowPath 现在就是三段式实例**（定义在本节末尾）。
    #    改动理由：nav2 自带 11 份 BT 的 FollowPath 节点全都只写
    #    controller_id="FollowPath"、且**一份都不传 goal_checker_id**
    #    （已逐个查过 /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/）。
    #    所以"让所有导航走三段式"的最小改法就是让名字叫 FollowPath 的那个实例
    #    是三段式 —— 一份 BT 都不用改，rviz 手动目标 / ros2 action send_goal
    #    / 任何 NavigateToPose 调用方立刻生效。
    #
    #    按仓库规范旧逻辑留开关不删，随时可用 controller_id 切回做 A/B。
    #    它同时是下面三份 MPPI 参数副本的**基准块**，
    controller_plugins: ["FollowPath", "FollowPathExplore"]

    progress_checker:
      # !!! 必须用 PoseProgressChecker 而不是 SimpleProgressChecker !!!
      # SimpleProgressChecker 只量**平移**：要求 10s 内移动 0.5m。
      # 而三段式跟踪的 ALIGN 段是纯旋转(vx=vy 严格为 0)，那段时间平移恒为 0，
      # 时钟却在走 —— 于是旋转时间直接从 10s 预算里扣掉。
      # 实测算术：ALIGN 最长 5.55s(零平移) + FOLLOW 段均速 0.111m/s 走完 0.5m 需 4.50s
      #           = 10.05s > 10s，必然报 Failed to make progress。
      # 注意失败**发生在 FOLLOW 相位**(实测 2/2)，所以只看"失败时在哪个相位"会误判成
      # 与旋转无关 —— 真正的因果是前一段旋转已经把时钟耗掉了。
      #
      # PoseProgressChecker 把**旋转也算作进展**(位移达标 OR 转角达标 任一即重置计时)，
      # 等价于"旋转期间不追究平移"，而真正的全停(既不平移也不转)仍会在 10s 内被抓到。
      # 这比放大 movement_time_allowance 好：那样做会让真卡死也要多等一倍时间。
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5
      # 转过这个角度即算有进展。取 0.10rad(5.7°)，依据是两条硬边界：
      #   上界：必须 < start_min_angle(0.20rad)。ALIGN 段只在朝向误差超过
      #         start_min_angle 时才进入，所以一次对齐最小可能只转 0.20rad；
      #         阈值若 >= 0.20，短对齐就触发不了计时重置，等于没启用。
      #         （这条是本仓库的配置测试抓出来的：我最初写 0.35 就踩了。）
      #   下界：必须 >> 里程计角度噪声。P0 实测原地旋转停后余转仅 0.006~0.033rad，
      #         噪声远小于 0.10，不会把原地抖动误判成进展。
      required_movement_angle: 0.10
      movement_time_allowance: 10.0
    # !!! 2026-08-20 到位精度收紧：xy/yaw 0.25 -> 0.10 !!!
    # 实测依据(干净总线上直发 /cmd_vel，见 docs 中 P0 扫描)：本底盘发零速后不刹停，
    # 而是缓慢蠕行，滑行量 @0.25m/s = 0.0688m、@0.40m/s = 0.1000m(4s 窗口)，
    # 4s 时残速仍有 0.0045~0.0118m/s。滑行量与 0.10 容差**同量级**，所以：
    #   · 单纯收紧容差不会让机器人停得更准，只会让判据更容易不达标；
    #   · 要真的做到 0.10m，接近段速度必须压到 0.10~0.15m/s(滑行 0.034~0.049m)。
    # 联动：astribot_s1_autonomy 的 validator.goal_clearance_radius 必须跟着改(已改 0.10)，
    #       协调器 arrival_xy_tolerance 必须 >= 本值(已改 0.15)。
    # !!! yaw_goal_tolerance 放宽到 3.15(≈±180°，等于不约束朝向) !!!
    # 原因：SimpleGoalChecker **同时**检查位置和朝向，而探索场景按需求刻意
    # 跳过终点原地旋转(FollowPathExplore: align_goal_enabled=false)。
    # 实测：位置偏差 0.165m 已满足 0.18，但朝向偏差 94.2° 远超 11.5° ->
    # goal checker 永不满足 -> FollowPath 不成功 -> Failed to make progress ->
    # 恢复行为 -> 超时。现象就是「转完之后不跟路径、原地漂移」。
    #
    # 朝向约束并没有消失，只是移到了知道场景的那一层：
    #   · 协调器 check_yaw + arrival_yaw_tolerance 负责复核
    #
    # ⚠️ 这里原来还写着"三段式控制器 align_goal_enabled=true 负责转到位"，
    #    那一句是**错的**，已删：本值 3.15 恰恰是让 ALIGN_GOAL 段拿不到执行机会的
    #    原因（判到位与进 ALIGN_GOAL 用的是同一个 dist <= xy_goal_tolerance）。
    #    详见下面 FollowPath 实例 align_goal_enabled 上方的推导。
    #    ——「守卫/测试/注释三处写同一个错理由 = 一份证据不是三份」，故一并纠正。
    # 需要在 Nav2 层也严格卡朝向时，正解是加第二个 goal checker 并让**每个**行为树
    # 都显式传 goal_checker_id —— 注意不能只是把它加进 goal_checker_plugins 列表：
    # 该端口无默认值，列表里有两项而调用方传空字符串会让每次 FollowPath 直接 abort。
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # !!! 0.10 已被实测否决，不要再改回去 !!!
      # 0.10 时实测：派发 10 次、ARRIVED **0** 次、恢复行为 30 次 —— Nav2 从不报成功，
      # 因为滑行量(0.069~0.100m)与容差同量级，MPPI 无法在 0.10m 内稳住。
      # 0.18 = 实测最大滑行 0.100 + 0.08 余量，是"比 0.25 紧一档且仍可收敛"的取值。
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 3.15   # ≈±180°，等于不约束朝向（理由见上）
    # 收紧前的原值，保留作一键回退档(仓库规范：旧逻辑留开关，不直接删)。
    # 用法：FollowPath action 的 goal_checker_id 填 "loose_goal_checker"。
    loose_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # ================== 三段式路径跟踪（astribot_s1_path_tracking）==================
    # 相位：原地对齐路径起始方向 -> 沿路径行驶 -> 原地对齐目标姿态。
    # 跟踪段委托给内层控制器（这里用上面同一套 MPPI），本插件只加相位调度与原地旋转。
    #
    # !!! 为什么可以安全地列多个 controller_plugins !!!
    # 这与 goal_checker_plugins 不同：FollowPath 行为树节点的 controller_id 端口
    # **有默认值 "FollowPath"**，而 goal_checker_id 端口**没有默认值**（传空字符串）。
    # 所以多控制器共存不会像多 goal checker 那样导致 abort —— 只要其中一个叫 FollowPath。
    #
    # 两个实例的区别只有 align_goal_enabled：
    #   FollowPath          终点对齐**开** —— 默认实例，所有 NavigateToPose 目标走这里
    #   FollowPathExplore   终点对齐**关** —— 自主探索（按需求：到位后不再转朝向）
    # 选择方式：FollowPath action 的 controller_id，不在代码里 if 场景。
    #
    # 🔴 2026-09-07 本块从 FollowPathThreePhase 改名为 FollowPath（要求：所有导航
    #    改三段式）。改名而不是复制一份：nav2 的内层参数前缀是 <实例名>.inner，
    #    再加一个实例就是第四份 MPPI 参数副本。
    FollowPath:
      plugin: "astribot_s1_path_tracking::ThreePhaseController"
      inner_controller_plugin: "nav2_mppi_controller::MPPIController"
      align_start_enabled: true
      # ⚠️ align_goal_enabled=true，但**当前这一段实际拿不到执行机会**。
      #    这是既有状态、不是新引入的缺陷，写在这里是为了不留一个"看着开着其实
      #    关着"的开关。运行时控制器也会 WARN 一次（warnIfGoalAlignInert）。
      #
      #    机制：进入 ALIGN_GOAL 的条件是 dist_to_goal <= xy_tol，而 xy_tol
      #    取自 general_goal_checker；controller_server 判到位用的是**同一个**
      #    goal checker，且 yaw_goal_tolerance: 3.15 >= pi 等于不约束朝向，
      #    于是"判到位" ≡ dist <= 0.18 —— 与进 ALIGN_GOAL 是同一个数。
      #    位置一进容差，nav2 当拍就结束 action，本段最多拿到一拍。
      #
      #    真正启用它需要四处联动，漏一处则**每个目标都 abort**：
      #      1. 加一个卡朝向的 goal checker（不能只加进 goal_checker_plugins：
      #         列表 >1 项而调用方传空 goal_checker_id 会直接 abort）
      #      2. 自带两份 BT 并在 FollowPath 节点显式传 goal_checker_id
      #      3. bt_navigator 设 default_nav_to_pose_bt_xml 指向那份 BT
      #      4. 探索协调器的 follow_goal_checker_id 显式赋值
      #    用户已决定本轮不动 goal checker，故先如实记录。
      align_goal_enabled: true
      # 路线A：原值 false。当时的理由是"内层 MPPI 是 Omni，掐掉 vy 会让内层的
      # 预测与实际下发不一致（它以为能横移）"——那个理由现在不成立了：内层已配成
      # motion_model: "DiffDrive" + vy_max/vy_std = 0，它自己就不再采样横移。
      # 置 true 只是最后一道保险（代码默认值本来就是 true）。
      zero_vy_in_follow: true
      align_kp: 1.0
      # 实测原地旋转跟踪比 0.73~0.92，且发零速后仍余转 0.006(慢)~0.033(快) rad，
      # 所以上限不取满 wz_max(2.0)，留出减速余量。
      align_max_vel: 0.6
      # 实测 0.05 rad/s 就能转动（不存在静摩擦地板），所以下限取 0.05 足够；
      # 它只在比例律算出更小值时生效，且永远不会超过 align_max_vel。
      align_floor_vel: 0.05
      align_tolerance: 0.05
      # 必须 >= align_tolerance，否则该段进去就立刻满足、形同虚设（代码里会拒绝启动）。
      start_min_angle: 0.20
      start_heading_lookahead: 0.5
      align_timeout: 15.0
      # 两次 tick 的空档超过此值 => 上一个 FollowPath action 已经结束，这次 setPlan
      # 是**同一目标的新一次下发**，必须重发一份完整的对齐预算。
      # 必须 in (0, align_timeout)：置 0 会让每次周期重规划都被判成新尝试、
      # align_timeout 永远等不到触发；>= align_timeout 则救不了那个锁死（代码里会拒绝启动）。
      # 0.5s = controller_frequency(20Hz) 下 10 拍，远大于单拍抖动。
      new_attempt_gap: 0.5
      follow_timeout: 0.0        # 0 = 交给 nav2 的 progress_checker
      # 只在取不到 GoalChecker 容差时兜底；正常路径下容差**取自 GoalChecker**，
      # 不在这里维护第二份（两处各存一份必然漂开）。
      fallback_xy_tolerance: 0.18
      fallback_yaw_tolerance: 0.20
      # ---- 接近段限速（提升到位精度，2026-09-07）----
      # 依据（run11 18 轮实测，/tmp/explore_run11/metrics/run11_rounds.csv）：
      #   cross_track_p95_m      0.048   <- 沿途跟得很准
      #   arrival_error_xy_m     0.121   <- 误差集中在终段
      #   overshoot_radial_m     0.146
      #   vel_track_best_lag_s   0.55 (max 0.64)，vel_track_gain 0.977
      # 即：**不是路径跟不准，是指令->实际速度有 0.55s 未建模死时间**（增益 0.977
      # 说明底盘最终跟得上、只是慢半拍）。终段过冲 ≈ v_接近 × τ；
      # 反推 0.146/0.55 ⇒ 当时接近速度约 0.27 m/s，自洽。
      #
      # 为什么不靠调 MPPI 权重：nav2 MPPI 的模型里**没有任何时延项**（无 dead-time
      # 参数），改 GoalCritic/PathFollowCritic 的 threshold_to_consider 或权重
      # 一点也动不了 v·τ 这个乘积。唯一的杠杆是压小 v_接近。
      #
      # 为什么线性收敛而不是硬上限：带 τ 时终段过冲 ≈ v(d)·τ 随 d→0 自己趋于 0，
      # 线性律对时延是**自校正**的；硬上限在跨阈那一拍产生速度阶跃，且到达时
      # 速度仍恰好等于上限。这也是 nav2 自带 RPP 的形状（见 nav2_params_rpp.yaml
      # 的 approach_velocity_scaling_dist + min_approach_linear_velocity），沿用同一口径。
      #
      # 作用面：只夹 kFollow 段的线速度**模长**（旋转不变，按比例缩放 vx/vy），
      # 不夹 wz（终段仍要继续对齐路径方向）。
      # 注：2026-09-07 前这里还有一段"窄通道接管不受影响"的说明。那一层已删，
      # 连带解掉一个零余量重合：approach_v_min(0.05) 曾恰好等于窄通道第二入口的
      # 交接门槛 narrow_v_along/2，即终段一踩到下限就被判"内层太慢该接管"。
      approach_enabled: true
      # 收敛区长度 D。隐含最大减速在 d=D 处 = v0²/D = 1.0²/1.50 = 0.67 m/s²，
      # ≤ 实测有效减速 0.45~0.8 m/s²（由滑行量反推 v²/2d：0.069m@0.25 ⇒ 0.45、
      # 0.100m@0.40 ⇒ 0.8）。取 D=1.0 则隐含 1.0 m/s²、超出底盘能力，
      # 又会变成"规划了做不到的刹车"。
      # 另有硬约束 D > fallback_xy_tolerance（代码里拒绝启动）：否则限速段整个
      # 落在到位容差内、一次都不生效，而日志上看不出任何异常。
      approach_dist: 1.50
      # 速度下限。终段残留过冲 ≈ v_min·τ = 0.05×0.55 = 0.028m，落在 0.05 目标内。
      # 下界依据：实测底盘 0.02 m/s 就能平动（无静摩擦地板），故 0.05 有 2.5 倍
      # 余量、不会蠕行不动。置 0 会让终段算出驱动不了底盘的速度而卡在容差外。
      approach_v_min: 0.05
      inner:
        # !!! 这一整块是原始 FollowPath 的 MPPI 配置逐行复制(含全部 10 个 critics) !!!
        # 上一版我只手抄了 15 行、漏掉 critics —— MPPI 的代价函数**全部**来自 critics，
        # 没有 PathFollowCritic/PathAlignCritic 就没有任何东西把机器人往路径上拉、往前推。
        # 实测现象：起步对齐正常、机器人贴在路径上(距路径 0.023m)，但指令 vx 均值
        # -0.021(往后)、剩余距离在 1.47~1.59m 之间来回晃、Failed to make progress ——
        # 也就是「转完之后原地漂移」。
        # 改内层参数时不要只改这里：两处会漂开，应连同上面的 FollowPath 一起改。
          plugin: "nav2_mppi_controller::MPPIController"
          time_steps: 56
          model_dt: 0.05
          batch_size: 2000
          vx_std: 0.2
          # 路线A（机头沿路径）：横向自由度从"模型层"去掉，不是靠加航向权重。
          # 原值 vy_std: 0.2（采样横移轨迹）。置 0 后 MPPI 不再采样任何横移。
          vy_std: 0.0
          wz_std: 0.4
          vx_max: 1.0
          vx_min: -1.0
          # 路线A：原值 vy_max: 1.0。置 0 = 机头必须指向前进方向，
          # 于是 PathAlignCritic(14.0) 的位置对齐只能靠转向来满足。
          vy_max: 0.0
          wz_max: 2.0
          ax_max: 2.5
          ax_min: -2.5
          ay_max: 2.5
          az_max: 3.2
          iteration_count: 1
          prune_distance: 1.7
          transform_tolerance: 0.2
          temperature: 0.3
          gamma: 0.015
          # !!! 关键参数 !!!：路线A 已把这里从 "Omni" 改成 "DiffDrive"。
          # 原值 motion_model: "Omni"（配 vy_max: 1.0 / vy_std: 0.2），机器人会蟹行：
          # PathAlignCritic 只约束位置，横移就能满足它，机头是自由变量。
          # 改 DiffDrive 后机头沿路径成为运动学必然，不需要再调航向权重。
          motion_model: "DiffDrive"
          visualize: false
          reset_period: 1.0
          regenerate_noises: false
          TrajectoryVisualizer:
            trajectory_step: 5
            time_step: 3
          AckermannConstraints:
            min_turning_r: 0.0
          critics: [
            "ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
            "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
            "PreferForwardCritic", "ObstaclesCritic", "TwirlingCritic",
            "CurvatureSpeedLimitCritic"]
          ConstraintCritic:
            enabled: true
            cost_power: 1
            cost_weight: 4.0
          GoalCritic:
            enabled: true
            cost_power: 1
            cost_weight: 5.0
            threshold_to_consider: 1.4
          GoalAngleCritic:
            enabled: true
            cost_power: 1
            cost_weight: 3.0
            threshold_to_consider: 0.5
          PreferForwardCritic:
            enabled: true
            cost_power: 1
            # 全向底盘不强制"必须朝前走"，权重比典型差速车配置调低一些，允许侧移/斜移。
            cost_weight: 2.0
            threshold_to_consider: 0.5
          CostCritic:
            enabled: true
            cost_power: 1
            cost_weight: 3.81
            critical_cost: 300.0
            # 保持 true。曾改成 false 试图解决窄通道走不动，实测**无可测收益**后回退，
            # 详见本文件末尾「窄通道通行能力：一次未能证实的尝试」。
            # 那一节记录的「足迹代价在 <1.62m 通道里饱和成 253」是实测硬数据，
            # 将来真在窄通道里卡住时可以直接接着查，不用重来一轮。
            consider_footprint: true
            collision_cost: 1000000.0
            near_goal_distance: 1.0
          PathAlignCritic:
            enabled: true
            cost_power: 1
            cost_weight: 14.0
            max_path_occupancy_ratio: 0.05
            trajectory_point_step: 4
            threshold_to_consider: 0.5
            offset_from_furthest: 20
          PathFollowCritic:
            enabled: true
            cost_power: 1
            cost_weight: 5.0
            offset_from_furthest: 5
            threshold_to_consider: 1.4
          PathAngleCritic:
            enabled: true
            cost_power: 1
            cost_weight: 2.0
            # 路线A 故意不动 PathAngleCritic（理由见顶层 FollowPath 同名块）。
            offset_from_furthest: 4
            threshold_to_consider: 0.5
            max_angle_to_furthest: 1.0
          TwirlingCritic:
            enabled: true
            twirling_cost_power: 1
            # 路线A：原值 10.0。罚 mean|wz| 会压制 DiffDrive 下必需的转向；
            # 反汇编确认它在非全向模型下不会自动失效，必须显式降权。
            twirling_cost_weight: 1.0
          # ═══ 曲率-速度耦合限速（本仓库自研，思路来自社区 PR AngularVelocitySpeedLimitCritic）═══
          # 判据只有一条恒等式：a_lat = v*|wz| = kappa*v^2，要求 <= a_lat_max，
          # 等价于 v <= sqrt(a_lat_max / kappa) —— 后者就是 vx = f(kappa) 那条耦合曲线。
          # 项1（反馈）罚 rollout 自身 v*|wz| 的超出量；项2（前馈）从前方路径最大 Menger
          # 曲率算速度上限再罚超出量。"入弯**前**就减速"只能来自项2：一条"保持高速、
          # 先不转"的 rollout |wz|≈0，反馈项对它毫无读数，而它恰是过弯冲出去的那条。
          # 完整推导 / 与其他 critic 的关系，见
          #   astribot_s1_path_tracking/include/astribot_s1_path_tracking/curvature_speed_limit_critic.hpp
          # 它罚的是 v*|wz|，**低速转弯代价恒为 0**，所以不会重现 TwirlingCritic 10.0
          # 压制对齐的那个问题，也不是把 Twirling 调回 10.0 的替代品（两者不要一起加）。
          CurvatureSpeedLimitCritic:
            enabled: true
            # 幂次取 2：越限越狠，而软带内仍近线性、梯度温和。
            cost_power: 2
            # 项1 权重。超出量已归一化到 a_lat_max，量纲无关，可跨速度档位/机型迁移。
            cost_weight: 6.0
            # 项2 权重（单位 m/s，未归一化）。置 0 = 退化成社区 PR 的纯反馈行为。
            path_cost_weight: 8.0
            path_lookahead_dist: 1.5
            # 终段让位给 GoalCritic 与接近段限速，否则两层限速串联叠乘把终段拖成龟速。
            threshold_to_consider: 0.5
            # ⚠ 侧向加速度的**物理上界 = vx_max * wz_max**，而 navigation.launch.py 会把
            #   vx_max 重写成 max_linear_speed。按轴 0.2 档位下上界只有 0.2*2.0 = 0.4，
            #   惩罚触发要 |wz| > 1.05 ⇒ kappa > 5.25 (R < 0.19m)，全局路径不会有这种曲率
            #   ⇒ **该档位下本 critic 近似空操作**。这是物理事实不是 bug：0.2m/s 绕 R=1m
            #   只需 0.04 m/s^2 侧向加速度，本来就不该限速。推论：若 0.2 档位下仍出现
            #   大曲率跟踪失败，根因不在动力学，而在 PathAngleCritic 的 ±57.3° 航向死区。
            #   收益在解除限速跑 vx_max=1.0 时显现：上界 2.0，从 kappa>0.21 (R<4.8m) 起咬，
            #   R=1m 处限到 0.458 m/s（-54%）。
            #   a_lat_max >= 上界时 initialize() 会打 WARN 明说"恒为空操作"（否则它会静默无效，
            #   而 nav2 只打一条 "Critic loaded"，不会告诉你它不起作用）。
            # ⚠ 本值是**待实测标定项**，验收看大曲率处 v 与 wz 的实测联合分布，不是这个数字本身。
            a_lat_max: 0.35
            # 软带起点 = soft_ratio * a_lat_max = 0.21 m/s^2。它存在的唯一理由是避免零梯度区：
            # 硬 hinge 在未越限时代价恒 0，MPPI 无法给"还没越限但已经很快"的样本排序。
            # 本仓库已两次栽在零梯度上（足迹代价在窄通道饱和成 253 / 全局 costmap 恒为 0）。
            # 等价地 v_soft / v_hard = sqrt(soft_ratio)。取 1.0 退化成硬 hinge，不推荐。
            soft_ratio: 0.6
            # 过弯速度地板：防极大曲率处把允许速度算到 0 而彻底不动。
            v_min_turn: 0.08
            # v_max 刻意**没有**这个键 —— 它取父控制器的 vx_max，因此自动跟着
            # max_linear_speed 走。同一物理量在 yaml 里出现两次一定会漂开。
          ObstaclesCritic:
            enabled: true
            cost_power: 1
            repulsion_weight: 1.5
            critical_weight: 20.0
            # 保持 true，理由同 CostCritic（试过 false，无可测收益，已回退）。
            consider_footprint: true
            collision_cost: 1000000.0
            # !!! 0.10 -> 0.05：这一条**没有**跟着 consider_footprint 一起回退 !!!
            # 它的依据独立于 consider_footprint，且不涉及那条
            # "Inconsistent configuration in collision checking" 告警（那是 false 才有的）。
            #
            # 这是「足迹边缘到障碍」的重罚带宽度，带内吃 critical_weight=20 的重罚。
            # 实测本仓库地图（全局 costmap 快照，280x416）：
            #   center-clearance ∈ [0.05,0.10) 的位置占可行域 6.71%（物理通道宽 0.88~0.98m）
            #   center-clearance <  0.05       的位置占可行域 0.00%
            # 即 0.10 恰好把**所有**真实窄通道罚了个遍，而 0.05 一个不罚 ——
            # 这个阈值正好落在本地图窄通道分布的断层上，不是随手取的。
            #
            # 安全性不靠这个参数兜底：真碰撞由 254 判定（consider_footprint:true 下
            # 253 不算碰撞），且足迹本身对真实底盘留有余量。
            # ⚠️ 2026-09-07 换正方形足迹后这个余量**变薄了**，如实记下：
            #    八边形 R=0.42 的最小余量 34mm（对角：顶点 0.42 vs 真实轮缘 0.386）；
            #    正方形 a=0.31 的最小余量 10mm（轴向：0.310 vs 躯干圆柱 0.300），
            #    对角方向反而更宽（0.438 vs 0.386，余量 52mm）。
            #    另有 footprint_padding 默认 0.01 再叠 10mm ⇒ 有效最小余量 20mm。
            #
            # !!! 但要注意：这条改动同样**没有**实测收益证据 !!!
            # 三个已验证可达目标上改前改后都是 3/3 SUCCEEDED、0 次
            # "Failed to make progress"，差异在单次运行噪声内。保留它是因为
            # 「罚遍所有窄通道」这个事实独立成立、且风险面比 consider_footprint 小，
            # 但它仍属**待评估**状态，不是已验证的优化。
            # 单独立项要做的事见文件末尾「待评估：collision_margin_distance」。
            collision_margin_distance: 0.05
            near_goal_distance: 0.5

    FollowPathExplore:
      plugin: "astribot_s1_path_tracking::ThreePhaseController"
      inner_controller_plugin: "nav2_mppi_controller::MPPIController"
      align_start_enabled: true
      # !!! 探索场景刻意为 false !!! 与 exploration_coordinator_params.yaml 的
      # check_yaw: false 必须保持一致 —— 既然不对齐终点姿态，再去卡朝向偏差
      # 就是让每个探索目标都必然判失败。
      align_goal_enabled: false
      # 路线A：原值 false，理由同 FollowPath 实例的同名项（内层已非全向）。
      zero_vy_in_follow: true
      align_kp: 1.0
      align_max_vel: 0.6
      align_floor_vel: 0.05
      align_tolerance: 0.05
      start_min_angle: 0.20
      start_heading_lookahead: 0.5
      align_timeout: 15.0
      # 两次 tick 的空档超过此值 => 上一个 FollowPath action 已经结束，这次 setPlan
      # 是**同一目标的新一次下发**，必须重发一份完整的对齐预算。
      # 必须 in (0, align_timeout)：置 0 会让每次周期重规划都被判成新尝试、
      # align_timeout 永远等不到触发；>= align_timeout 则救不了那个锁死（代码里会拒绝启动）。
      # 0.5s = controller_frequency(20Hz) 下 10 拍，远大于单拍抖动。
      new_attempt_gap: 0.5
      follow_timeout: 0.0
      fallback_xy_tolerance: 0.18
      fallback_yaw_tolerance: 0.20
      # ---- 接近段限速（提升到位精度，2026-09-07）----
      # 依据（run11 18 轮实测，/tmp/explore_run11/metrics/run11_rounds.csv）：
      #   cross_track_p95_m      0.048   <- 沿途跟得很准
      #   arrival_error_xy_m     0.121   <- 误差集中在终段
      #   overshoot_radial_m     0.146
      #   vel_track_best_lag_s   0.55 (max 0.64)，vel_track_gain 0.977
      # 即：**不是路径跟不准，是指令->实际速度有 0.55s 未建模死时间**（增益 0.977
      # 说明底盘最终跟得上、只是慢半拍）。终段过冲 ≈ v_接近 × τ；
      # 反推 0.146/0.55 ⇒ 当时接近速度约 0.27 m/s，自洽。
      #
      # 为什么不靠调 MPPI 权重：nav2 MPPI 的模型里**没有任何时延项**（无 dead-time
      # 参数），改 GoalCritic/PathFollowCritic 的 threshold_to_consider 或权重
      # 一点也动不了 v·τ 这个乘积。唯一的杠杆是压小 v_接近。
      #
      # 为什么线性收敛而不是硬上限：带 τ 时终段过冲 ≈ v(d)·τ 随 d→0 自己趋于 0，
      # 线性律对时延是**自校正**的；硬上限在跨阈那一拍产生速度阶跃，且到达时
      # 速度仍恰好等于上限。这也是 nav2 自带 RPP 的形状（见 nav2_params_rpp.yaml
      # 的 approach_velocity_scaling_dist + min_approach_linear_velocity），沿用同一口径。
      approach_enabled: true
      # 收敛区长度 D。隐含最大减速在 d=D 处 = v0²/D = 1.0²/1.50 = 0.67 m/s²，
      # ≤ 实测有效减速 0.45~0.8 m/s²（由滑行量反推 v²/2d：0.069m@0.25 ⇒ 0.45、
      # 0.100m@0.40 ⇒ 0.8）。取 D=1.0 则隐含 1.0 m/s²、超出底盘能力，
      # 又会变成"规划了做不到的刹车"。
      # 另有硬约束 D > fallback_xy_tolerance（代码里拒绝启动）：否则限速段整个
      # 落在到位容差内、一次都不生效，而日志上看不出任何异常。
      approach_dist: 1.50
      # 速度下限。终段残留过冲 ≈ v_min·τ = 0.05×0.55 = 0.028m，落在 0.05 目标内。
      # 下界依据：实测底盘 0.02 m/s 就能平动（无静摩擦地板），故 0.05 有 2.5 倍
      # 余量、不会蠕行不动。置 0 会让终段算出驱动不了底盘的速度而卡在容差外。
      approach_v_min: 0.05
      inner:
        # !!! 这一整块是原始 FollowPath 的 MPPI 配置逐行复制(含全部 10 个 critics) !!!
        # 上一版我只手抄了 15 行、漏掉 critics —— MPPI 的代价函数**全部**来自 critics，
        # 没有 PathFollowCritic/PathAlignCritic 就没有任何东西把机器人往路径上拉、往前推。
        # 实测现象：起步对齐正常、机器人贴在路径上(距路径 0.023m)，但指令 vx 均值
