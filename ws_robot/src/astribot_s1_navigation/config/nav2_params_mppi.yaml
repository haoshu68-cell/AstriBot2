# 待评估（单独立项）：collision_margin_distance 0.10 -> 0.05
#
# 这一条**没有**跟着 consider_footprint 一起回退，当前生效值是 0.05，
# 但它属于「依据成立、收益未证实」的状态，需要单独评估后再定去留。
#
# ---- 保留它的依据（独立于 consider_footprint）----
# 这是「足迹边缘到障碍」的重罚带宽度，带内吃 critical_weight=20 的重罚。
# 实测全局 costmap 快照（280x416 @0.05）里 center-clearance 的分布：
#     [0.00,0.05)   0.00% 可行域
#     [0.05,0.10)   6.71%      ← 物理通道宽 0.88~0.98m，真实窄通道全在这里
#     [0.10,0.15)   6.37%
#     [0.15,0.25)   9.69%
#     [0.25,0.40)  12.16%
#     [0.40,inf)   65.07%
# 0.10 恰好把**所有**真实窄通道罚了个遍，0.05 一个不罚 ——
# 阈值正好落在本地图窄通道分布的断层上（<0.05 的占 0.00%），不是随手取的。
# 安全性不靠它兜底：真碰撞由 254 判定，八边形足迹本身已有 34mm 余量
# （顶点 0.42 vs URDF 实测真实轮缘包络 0.386）。
#
# ---- 立项要回答的问题 ----
#   1. 收益：需要能触发重罚带的用例（见上一节「下次要验证该怎么做」）。
#      在当前地图上改前改后都是 3/3 成功，测不出差别。
#   2. 风险：0.05 只有一格（分辨率 0.05m）的软缓冲，定位噪声下是否够？
#      要量的是实际最小通过间隙的分布，而不是只看有没有碰撞。
#   3. 与 inflation_radius 的关系：ObstaclesCritic 的 repulsion 范围取自
#      局部 costmap 的 inflation_radius(0.65)。在窄于 1.3m 的通道里
#      整条通道都在膨胀带内，repulsion 项没有零点、无法给出「走中间」的梯度。
#      要评估 collision_margin_distance 就绕不开这一条，两个参数应一起调。
#   4. 断层是这张地图的性质还是普遍性质？换场地要重测那张分布表，
#      否则 0.05 这个数字没有可移植性。
#
# ---- 复现分布表的方法 ----
# 订阅 /global_costmap/costmap_raw，对「非致命非未知」区域做距离变换
# （到 >=253 区域的距离即 center-clearance），按上面的区间统计占比。
# 注意 253 的语义已经是「机器人中心在此则足迹必然碰撞」，
# 也就是致命区**已经**比物理障碍胀出了一个内切半径 —— 不要再减一次足迹半径，
# 这个双重计算的坑本轮踩过。
