# Nav2 参数文件（controller_plugin=rpp：Regulated Pure Pursuit + Smac2D）。
#
# !!! 重要说明（任务书要求 vs 机器人实际运动学的取舍，如实标注）!!!：RPP 是为非全向
# （差速/阿克曼）载体设计的路径跟踪控制器，不会真正利用本机器人全向轮的全向平移
# 能力（车体基本会先转向、再沿朝向前进，不会斜着直接平移）。这里按任务书"优先使用
# Nav2稳定默认规划器（Smac全局规划、Regulated Pure Pursuit局部控制器）"的要求把它设成
# 默认值，行为是正确的、只是没有发挥全向底盘优势；真正推荐用 controller_plugin:=mppi
# （见 nav2_params_mppi.yaml），实测对比结论见 README_NAVIGATION.md。
#
# 坐标系统一用 astribot_torso_base（不是 base_link——本机器人 URDF 根链接叫这个名字，
# 全仓库没有 base_link），全局/局部代价地图不跑 map_server/amcl（SLAM Toolbox 自己在
# mapping/localization 两种模式下都会发布 /map + map->odom TF，详见
# README_NAVIGATION.md"为什么不用amcl/map_server"一节）。
# 速度/加速度上限对齐 astribot_chassis.yaml 的 joint_max_velocities: [1.0, 1.0, 2.0]
# (x, y, yaw)，不让 Nav2 下发超过底盘物理限制的指令。

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    # 全向底盘：y方向阈值不能像差速车那样设成 0.5(相当于禁用y轴)，跟x/theta一致即可。
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    # !!! 只能列一个 !!! Nav2 规则：goal_checker_plugins 只有一项时它自动成为默认；
    # 列两项就必须由调用方通过 FollowPath 的 goal_checker_id 指定，而默认 BT 传的是
    # 空字符串 -> controller_server 每次 FollowPath 直接 abort：
    #   FollowPath called with goal_checker name "" ... which does not exist.
    # 症状是「机器人完全不跟踪路径 + 反复 spin/backup」，而汇总日志里只看到
    # 「Nav2 中止(无法规划或控制失败)」—— 真因只出现在
    # ~/.ros/log/controller_server_*.log 里。
    # 回退档 loose_goal_checker 定义保留在下面，但**不要**加进这个列表。
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # !!! 必须用 PoseProgressChecker 而不是 SimpleProgressChecker !!!
      # SimpleProgressChecker 只量**平移**：要求 10s 内移动 0.5m。
      # 而三段式跟踪的 ALIGN 段是纯旋转(vx=vy 严格为 0)，那段时间平移恒为 0，
      # 时钟却在走 —— 于是旋转时间直接从 10s 预算里扣掉。
      # 实测算术：ALIGN 最长 5.55s(零平移) + FOLLOW 段均速 0.111m/s 走完 0.5m 需 4.50s
      #           = 10.05s > 10s，必然报 Failed to make progress。
      # 注意失败**发生在 FOLLOW 相位**(实测 2/2)，所以只看"失败时在哪个相位"会误判成
      # 与旋转无关 —— 真正的因果是前一段旋转已经把时钟耗掉了。
      #
      # PoseProgressChecker 把**旋转也算作进展**(位移达标 OR 转角达标 任一即重置计时)，
      # 等价于"旋转期间不追究平移"，而真正的全停(既不平移也不转)仍会在 10s 内被抓到。
      # 这比放大 movement_time_allowance 好：那样做会让真卡死也要多等一倍时间。
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5
      # 转过这个角度即算有进展。取 0.10rad(5.7°)，依据是两条硬边界：
      #   上界：必须 < start_min_angle(0.20rad)。ALIGN 段只在朝向误差超过
      #         start_min_angle 时才进入，所以一次对齐最小可能只转 0.20rad；
      #         阈值若 >= 0.20，短对齐就触发不了计时重置，等于没启用。
      #         （这条是本仓库的配置测试抓出来的：我最初写 0.35 就踩了。）
      #   下界：必须 >> 里程计角度噪声。P0 实测原地旋转停后余转仅 0.006~0.033rad，
      #         噪声远小于 0.10，不会把原地抖动误判成进展。
      required_movement_angle: 0.10
      movement_time_allowance: 10.0
    # !!! 2026-08-20 到位精度收紧：xy/yaw 0.25 -> 0.10 !!!
    # 依据与联动约束同 nav2_params_mppi.yaml 的同名段，两份必须一起改，
    # 否则切控制器时精度口径会不一致(而这种不一致只在切换那次才显形)。
    # !!! yaw_goal_tolerance 放宽到 3.15(≈±180°，等于不约束朝向) !!!
    # 原因：SimpleGoalChecker **同时**检查位置和朝向，而探索场景按需求刻意
    # 跳过终点原地旋转(FollowPathExplore: align_goal_enabled=false)。
    # 实测：位置偏差 0.165m 已满足 0.18，但朝向偏差 94.2° 远超 11.5° ->
    # goal checker 永不满足 -> FollowPath 不成功 -> Failed to make progress ->
    # 恢复行为 -> 超时。现象就是「转完之后不跟路径、原地漂移」。
    #
    # 朝向约束并没有消失，只是移到了知道场景的那两层：
    #   · 三段式控制器 align_goal_enabled=true(FollowPathThreePhase) 负责转到位
    #   · 协调器 check_yaw + arrival_yaw_tolerance 负责复核
    # 需要在 Nav2 层也严格卡朝向时，正解是加第二个 goal checker 并让**每个**行为树
    # 都显式传 goal_checker_id —— 注意不能只是把它加进 goal_checker_plugins 列表：
    # 该端口无默认值，列表里有两项而调用方传空字符串会让每次 FollowPath 直接 abort。
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # !!! 0.10 已被实测否决，不要再改回去 !!!
      # 0.10 时实测：派发 10 次、ARRIVED **0** 次、恢复行为 30 次 —— Nav2 从不报成功，
      # 因为滑行量(0.069~0.100m)与容差同量级，MPPI 无法在 0.10m 内稳住。
      # 0.18 = 实测最大滑行 0.100 + 0.08 余量，是"比 0.25 紧一档且仍可收敛"的取值。
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 3.15   # ≈±180°，等于不约束朝向（理由见上）
    # 收紧前的原值，保留作一键回退档。
    loose_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # 全向底盘可以不用先转向再走，但 RPP 本身按非全向设计，这里保留常规的
      # rotate_to_heading 行为（否则 RPP 的路径跟踪逻辑会不稳定），这正是本节点的
      # 结构性限制，见文件头部说明。
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      allow_reversing: false

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      # SmacPlanner2D：栅格搜索，不强加非全向运动约束(不像SmacHybrid/StateLattice假设
      # 阿克曼转弯半径)，比较适合全向底盘。
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      # 未知区域禁行：全局规划器不得把未知栅格纳入路径。
      # 原来是 true —— 那会让 SmacPlanner2D 直接穿过没扫过的区域「抄近道」，
      # 与探索协调器的「未知区绝对禁行」冲突：协调器会把这种路径整条否掉，
      # 于是候选一个个被拒、探索原地打转。
      # 改成 false 后规划器自己就不会产生这种路径，两层约束方向一致。
      # 代价：探索初期已知区很小，可达目标也少；这是刻意的保守取向。
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # 「代价」相对「路径长度」的权重。仅有梯度不够 —— 权重太低时规划器仍会
      # 为了抄近道而贴边。配合 global inflation_radius 0.75 一起才构成「居中」。
      # 待实测标定项；验收看路径点到墙的实测距离，不是这个数字本身。
      cost_travel_multiplier: 8.0
      use_final_approach_orientation: false

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: astribot_torso_base
    transform_tolerance: 0.1
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: astribot_torso_base
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 直接引用 nav2_bt_navigator 自带的默认行为树 xml(不自己写BT)，
    # 路径通过 FindPackageShare 动态解析，见 navigation.launch.py。

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 全向底盘：x/y/theta 三个自由度都要给上限，跟 astribot_chassis.yaml 的
    # joint_max_velocities: [1.0, 1.0, 2.0] 对齐，不能让Nav2下发超过底盘物理限制的指令。
    max_velocity: [1.0, 1.0, 2.0]
    min_velocity: [-1.0, -1.0, -2.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    # 机械臂展开限速：arm_speed_limiter_node 发布到这个话题，percentage=true。
    speed_limit_topic: "/speed_limit"

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: astribot_torso_base
      use_sim_time: True
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # 机身近似回转体(torso碰撞圆柱半径0.3m + 轮子凸出部分)，用圆形足迹+安全余量，
      # 不用多边形——双臂/头部展开时的真实包络无法用静态足迹精确表达。
      # !!! 更正(C1，2026-08-25)：原注释说这个风险"靠 arm_speed_limiter_node 的展开
      # 限速缓解"，这句是错的——限速只降低速度，**完全不缩小碰撞包络**。实测(URDF
      # 全工作空间采样)机械臂水平伸展最大可达 0.8865m，比这里的 robot_radius 0.42
      # 多伸出 0.47m，这部分是规划器彻底看不见的真实碰撞风险，限速一点也没减少它。
      # 正确机制是姿态相关的动态足迹(nav2_collision_monitor 订阅机械臂 TF 实时改
      # footprint)，尚未实现，立项为 C1b，见 README_NAVIGATION.md。这里如实标成
      # 未解决，不再声称已被限速缓解。
      robot_radius: 0.42   # 真实底盘外接半径 0.386m（URDF 实测：轮心离轴 0.306 + 轮球半径 0.080），
                           # 取 0.42 留余量。原值 0.35 偏小 36mm，会让 Nav2 以为机器人比实际小、
                           # 规划出让轮子蹭到货架立柱的路径。rpp 版不需要显式 footprint
                           # （那是 MPPI 的 consider_footprint 才要求的），只用这个半径即可。
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # !!! 原值 0.25 比足迹外接半径还小，Nav2 每次启动都在报 ERROR：
        #   "The configured inflation radius (0.250) is smaller than the robot radius (0.35)"
        # 后果是膨胀层连机器人自身轮廓都覆盖不住，规划器拿不到"离墙远一点"的代价梯度，
        # 路径会紧贴障碍物走。inflation_radius 必须大于 robot_radius(0.42)。
        #
        # 取 0.65 后的代价梯度（圆形足迹内切=外接=0.42、cost_scaling_factor 3.0）：
        #   离障碍 0.42m -> 229   (刚好轮缘擦到，重罚)
        #   离障碍 0.50m -> 180
        #   离障碍 0.60m -> 133
        #   离障碍 >0.65m -> 0    (自由通行)
        # 注意膨胀代价只在机器人半径以内才是致死值，所以放大 inflation_radius
        # 不会把窄通道变成不可通行，只是让规划器更偏向走通道中间。
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # /scan 已经是 astribot_s1_perception 里"双Livox点云→预处理降采样→距离截断→
        # 2D投影"的产物(见livox_preprocess_node的range_min=0.35/voxel_size=0.15，
        # pointcloud_to_laserscan的高度切片0.05~0.6m)，不是把原始稠密点云直接喂进来。
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
          # ═══════ expected_update_rate：不设它等于关掉陈旧检测 ═══════
          # nav2 默认值是 0.0，含义是 ObservationBuffer::isCurrent() **永远返回 true**，
          # 也就是说 /scan 无论多旧，costmap 都认为数据是新的、一条告警都不打。
          #
          # 这不是理论担心，是实测过的事故(2026-09-01 21:26 那次急停)：
          #   /joint_states 断 → RSP 停发连杆 TF → 自滤逐连杆等满超时
          #   → /scan 掉到 0.56Hz、数据龄期 2.03s
          #   → nav2 全程照常规划、照常发速度，**零告警**
          # 设上之后至少会打：
          #   "The scan observation buffer has not been updated for X seconds,
          #    and it should be updated every Y seconds."
          #  (已在 libnav2_costmap_2d_core.so 里确认该字符串存在)
          #
          # !!! 必须知道它的边界 !!!：这是**告警，不是联锁**。
          # 实测 controller_server 二进制里没有任何检查 costmap currency 的字符串，
          # 所以陈旧时它**仍然会继续发速度**。真正的拒绝下发必须放在我们自己的
          # 写通路(chassis_cmd_bridge)里，别指望这一条。
          #
          # 0.2s = 两个雷达帧周期(10Hz)。取这个值而不是 0.1 的原因：健康态实测
          # /scan 是 9.9~10.04Hz，抖一帧就会超过 0.1 而误报。0.2 能容一帧抖动，
          # 又远小于会造成危险的秒级陈旧。
          expected_update_rate: 0.2
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: astribot_torso_base
      use_sim_time: True
      robot_radius: 0.42   # 真实底盘外接半径 0.386m（URDF 实测：轮心离轴 0.306 + 轮球半径 0.080），
                           # 取 0.42 留余量。原值 0.35 偏小 36mm，会让 Nav2 以为机器人比实际小、
                           # 规划出让轮子蹭到货架立柱的路径。rpp 版不需要显式 footprint
                           # （那是 MPPI 的 consider_footprint 才要求的），只用这个半径即可。
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
          # 理由与 local_costmap 那份相同（见上方长注释）。
          # 全局侧 update_frequency 是 1.0Hz，但陈旧判据跟的是**数据源**的到达间隔，
          # 与 costmap 自己的更新频率无关 —— 所以这里同样用 0.2。
          expected_update_rate: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # SLAM Toolbox 在 mapping/localization 两种模式下都会发布 /map，这里直接订阅，
        # 不跑 nav2_map_server（详见 README_NAVIGATION.md）。
        map_topic: /map
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # !!! 原值 0.25 比足迹外接半径还小，Nav2 每次启动都在报 ERROR：
        #   "The configured inflation radius (0.250) is smaller than the robot radius (0.35)"
        # 后果是膨胀层连机器人自身轮廓都覆盖不住，规划器拿不到"离墙远一点"的代价梯度，
        # 路径会紧贴障碍物走。inflation_radius 必须大于 robot_radius(0.42)。
        #
        # ======================================================================
        # 需求：(1) 全局路径尽可能居中；(2) **不要为抄近道去钻窄通道**，
        #      宁可绕远走宽阔大路。
        #
        # 规划器怎么算（nav2 humble node_2d.cpp 源码逐字确认，非推测）：
        #     getTraversalCost = 步长 x (1.0 + cost_travel_multiplier * cost/252)
        #     getHeuristicCost = 纯欧氏距离，**不含代价项**
        # 所以它最小化「几何长度 x 代价惩罚因子」，
        # 窄通道被选中的条件是：窄路长 x 惩罚因子 < 宽路长。
        #
        # !!! 根因：宽于 2 x inflation_radius 的通道，中心代价恒为 0 !!!
        # inflation_radius 0.75 时 2m 通道中心距墙 1.0m > 0.75m ⇒ 代价 0
        # ⇒ 惩罚因子 1.000 ⇒ 那条 2m 窄道在规划器眼里和 4m 大路**一样便宜**，
        # A* 只剩「谁短走谁」，于是必走窄通道。
        # 这不是权重不够大，是**信息不存在** —— cost_travel_multiplier 再大，
        # 乘的都是 0。（与 MPPI 那个「足迹代价饱和 253、梯度为 0」是同一类错误
        # 的镜像：一边饱和到顶、一边饱和到底，两边都没梯度。）
        #
        # 判据：inflation_radius >= (想惩罚的最窄通道宽度) / 2。
        # 需求口径 2m ⇒ 取 1.0；cost_travel_multiplier 取 8.0
        # （2m 通道原始代价 40.2 只有 1.5m 通道 85.1 的一半，权重要跟上才有区分度）。
        #
        # 取 1.0 + 8.0 后（本文件几何：圆形 robot_radius 半径 0.42）：
        #    1.5m 通道 -> 中心代价  93.6 -> 惩罚因子 3.973 -> 容忍绕路 3.97x
        #    2.0m 通道 -> 中心代价  44.2 -> 惩罚因子 2.404 -> 容忍绕路 2.40x
        #    2.5m 通道 -> 中心代价   0.0 -> 惩罚因子 1.000 -> 容忍绕路 1.00x
        #    3.0m 通道 -> 中心代价   0.0 -> 惩罚因子 1.000 -> 容忍绕路 1.00x
        #    4.0m 通道 -> 中心代价   0.0 -> 惩罚因子 1.000 -> 容忍绕路 1.00x
        #   「容忍绕路 Nx」= 宽路必须比窄路长 N 倍，规划器才肯放弃窄路。
        #
        # 取值含义要说清楚：inflation_radius 取多大，就等于宣告
        # 「比这更宽的通道我一律视为同等优良」。取 1.0 时 2.5m 与 4m 大路
        # 无法区分（都是 0）。若要连 2.5m 也轻微惩罚需取 1.25。
        #
        # 253(不可通行) 那一档由内切半径 0.42 决定、与 inflation_radius 无关，
        # 所以本改动**不缩小可行域**，只塑造梯度形状。
        #
        # 只改**全局**这一份：局部代价地图维持 0.65 不变。局部图被 MPPI 的
        # ObstaclesCritic/CostCritic 读取，抬高它会改变已验证的跟踪行为。
        # 判据固化在 test_config_consistency.py::TestGlobalPathCentering。
        # ======================================================================
        cost_scaling_factor: 3.0
        inflation_radius: 1.0
      always_send_full_costmap: True
