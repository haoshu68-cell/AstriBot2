# Nav2 参数文件（controller_plugin=rpp：Regulated Pure Pursuit + Smac2D）。
#
# !!! 重要说明（任务书要求 vs 机器人实际运动学的取舍，如实标注）!!!：RPP 是为非全向
# （差速/阿克曼）载体设计的路径跟踪控制器，不会真正利用本机器人全向轮的全向平移
# 能力（车体基本会先转向、再沿朝向前进，不会斜着直接平移）。这里按任务书"优先使用
# Nav2稳定默认规划器（Smac全局规划、Regulated Pure Pursuit局部控制器）"的要求把它设成
# 默认值，行为是正确的、只是没有发挥全向底盘优势；真正推荐用 controller_plugin:=mppi
# （见 nav2_params_mppi.yaml），实测对比结论见 README_NAVIGATION.md。
#
# 坐标系统一用 astribot_torso_base（不是 base_link——本机器人 URDF 根链接叫这个名字，
# 全仓库没有 base_link），全局/局部代价地图不跑 map_server/amcl（SLAM Toolbox 自己在
# mapping/localization 两种模式下都会发布 /map + map->odom TF，详见
# README_NAVIGATION.md"为什么不用amcl/map_server"一节）。
# 速度/加速度上限对齐 astribot_chassis.yaml 的 joint_max_velocities: [1.0, 1.0, 2.0]
# (x, y, yaw)，不让 Nav2 下发超过底盘物理限制的指令。

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    # 全向底盘：y方向阈值不能像差速车那样设成 0.5(相当于禁用y轴)，跟x/theta一致即可。
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    # !!! 只能列一个 !!! Nav2 规则：goal_checker_plugins 只有一项时它自动成为默认；
    # 列两项就必须由调用方通过 FollowPath 的 goal_checker_id 指定，而默认 BT 传的是
    # 空字符串 -> controller_server 每次 FollowPath 直接 abort：
    #   FollowPath called with goal_checker name "" ... which does not exist.
    # 症状是「机器人完全不跟踪路径 + 反复 spin/backup」，而汇总日志里只看到
    # 「Nav2 中止(无法规划或控制失败)」—— 真因只出现在
    # ~/.ros/log/controller_server_*.log 里。
    # 回退档 loose_goal_checker 定义保留在下面，但**不要**加进这个列表。
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # !!! 2026-08-20 到位精度收紧：xy/yaw 0.25 -> 0.10 !!!
    # 依据与联动约束同 nav2_params_mppi.yaml 的同名段，两份必须一起改，
    # 否则切控制器时精度口径会不一致(而这种不一致只在切换那次才显形)。
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # !!! 0.10 已被实测否决，不要再改回去 !!!
      # 0.10 时实测：派发 10 次、ARRIVED **0** 次、恢复行为 30 次 —— Nav2 从不报成功，
      # 因为滑行量(0.069~0.100m)与容差同量级，MPPI 无法在 0.10m 内稳住。
      # 0.18 = 实测最大滑行 0.100 + 0.08 余量，是"比 0.25 紧一档且仍可收敛"的取值。
      xy_goal_tolerance: 0.18
      yaw_goal_tolerance: 0.20
    # 收紧前的原值，保留作一键回退档。
    loose_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # 全向底盘可以不用先转向再走，但 RPP 本身按非全向设计，这里保留常规的
      # rotate_to_heading 行为（否则 RPP 的路径跟踪逻辑会不稳定），这正是本节点的
      # 结构性限制，见文件头部说明。
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      allow_reversing: false

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      # SmacPlanner2D：栅格搜索，不强加非全向运动约束(不像SmacHybrid/StateLattice假设
      # 阿克曼转弯半径)，比较适合全向底盘。
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      # 未知区域禁行：全局规划器不得把未知栅格纳入路径。
      # 原来是 true —— 那会让 SmacPlanner2D 直接穿过没扫过的区域「抄近道」，
      # 与探索协调器的「未知区绝对禁行」冲突：协调器会把这种路径整条否掉，
      # 于是候选一个个被拒、探索原地打转。
      # 改成 false 后规划器自己就不会产生这种路径，两层约束方向一致。
      # 代价：探索初期已知区很小，可达目标也少；这是刻意的保守取向。
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: astribot_torso_base
    transform_tolerance: 0.1
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: astribot_torso_base
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 直接引用 nav2_bt_navigator 自带的默认行为树 xml(不自己写BT)，
    # 路径通过 FindPackageShare 动态解析，见 navigation.launch.py。

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 全向底盘：x/y/theta 三个自由度都要给上限，跟 astribot_chassis.yaml 的
    # joint_max_velocities: [1.0, 1.0, 2.0] 对齐，不能让Nav2下发超过底盘物理限制的指令。
    max_velocity: [1.0, 1.0, 2.0]
    min_velocity: [-1.0, -1.0, -2.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    # 机械臂展开限速：arm_speed_limiter_node 发布到这个话题，percentage=true。
    speed_limit_topic: "/speed_limit"

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: astribot_torso_base
      use_sim_time: True
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # 机身近似回转体(torso碰撞圆柱半径0.3m + 轮子凸出部分)，用圆形足迹+安全余量，
      # 不用多边形——双臂/头部展开时的真实包络无法用静态足迹精确表达。
      # !!! 更正(C1，2026-08-25)：原注释说这个风险"靠 arm_speed_limiter_node 的展开
      # 限速缓解"，这句是错的——限速只降低速度，**完全不缩小碰撞包络**。实测(URDF
      # 全工作空间采样)机械臂水平伸展最大可达 0.8865m，比这里的 robot_radius 0.42
      # 多伸出 0.47m，这部分是规划器彻底看不见的真实碰撞风险，限速一点也没减少它。
      # 正确机制是姿态相关的动态足迹(nav2_collision_monitor 订阅机械臂 TF 实时改
      # footprint)，尚未实现，立项为 C1b，见 README_NAVIGATION.md。这里如实标成
      # 未解决，不再声称已被限速缓解。
      robot_radius: 0.42   # 真实底盘外接半径 0.386m（URDF 实测：轮心离轴 0.306 + 轮球半径 0.080），
                           # 取 0.42 留余量。原值 0.35 偏小 36mm，会让 Nav2 以为机器人比实际小、
                           # 规划出让轮子蹭到货架立柱的路径。rpp 版不需要显式 footprint
                           # （那是 MPPI 的 consider_footprint 才要求的），只用这个半径即可。
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # !!! 原值 0.25 比足迹外接半径还小，Nav2 每次启动都在报 ERROR：
        #   "The configured inflation radius (0.250) is smaller than the robot radius (0.35)"
        # 后果是膨胀层连机器人自身轮廓都覆盖不住，规划器拿不到"离墙远一点"的代价梯度，
        # 路径会紧贴障碍物走。inflation_radius 必须大于 robot_radius(0.42)。
        #
        # 取 0.65 后的代价梯度（圆形足迹内切=外接=0.42、cost_scaling_factor 3.0）：
        #   离障碍 0.42m -> 229   (刚好轮缘擦到，重罚)
        #   离障碍 0.50m -> 180
        #   离障碍 0.60m -> 133
        #   离障碍 >0.65m -> 0    (自由通行)
        # 注意膨胀代价只在机器人半径以内才是致死值，所以放大 inflation_radius
        # 不会把窄通道变成不可通行，只是让规划器更偏向走通道中间。
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # /scan 已经是 astribot_s1_perception 里"双Livox点云→预处理降采样→距离截断→
        # 2D投影"的产物(见livox_preprocess_node的range_min=0.35/voxel_size=0.15，
        # pointcloud_to_laserscan的高度切片0.05~0.6m)，不是把原始稠密点云直接喂进来。
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: astribot_torso_base
      use_sim_time: True
      robot_radius: 0.42   # 真实底盘外接半径 0.386m（URDF 实测：轮心离轴 0.306 + 轮球半径 0.080），
                           # 取 0.42 留余量。原值 0.35 偏小 36mm，会让 Nav2 以为机器人比实际小、
                           # 规划出让轮子蹭到货架立柱的路径。rpp 版不需要显式 footprint
                           # （那是 MPPI 的 consider_footprint 才要求的），只用这个半径即可。
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # SLAM Toolbox 在 mapping/localization 两种模式下都会发布 /map，这里直接订阅，
        # 不跑 nav2_map_server（详见 README_NAVIGATION.md）。
        map_topic: /map
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # !!! 原值 0.25 比足迹外接半径还小，Nav2 每次启动都在报 ERROR：
        #   "The configured inflation radius (0.250) is smaller than the robot radius (0.35)"
        # 后果是膨胀层连机器人自身轮廓都覆盖不住，规划器拿不到"离墙远一点"的代价梯度，
        # 路径会紧贴障碍物走。inflation_radius 必须大于 robot_radius(0.42)。
        #
        # 取 0.65 后的代价梯度（圆形足迹内切=外接=0.42、cost_scaling_factor 3.0）：
        #   离障碍 0.42m -> 229   (刚好轮缘擦到，重罚)
        #   离障碍 0.50m -> 180
        #   离障碍 0.60m -> 133
        #   离障碍 >0.65m -> 0    (自由通行)
        # 注意膨胀代价只在机器人半径以内才是致死值，所以放大 inflation_radius
        # 不会把窄通道变成不可通行，只是让规划器更偏向走通道中间。
        cost_scaling_factor: 3.0
        inflation_radius: 0.65
      always_send_full_costmap: True
