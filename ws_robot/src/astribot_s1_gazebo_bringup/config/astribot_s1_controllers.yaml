controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_left_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_right_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_left_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_right_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    wheel_effort_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - astribot_torso_joint_1
      - astribot_torso_joint_2
      - astribot_torso_joint_3
      - astribot_torso_joint_4
      - astribot_head_joint_1
      - astribot_head_joint_2
      - astribot_arm_left_joint_1
      - astribot_arm_left_joint_2
      - astribot_arm_left_joint_3
      - astribot_arm_left_joint_4
      - astribot_arm_left_joint_5
      - astribot_arm_left_joint_6
      - astribot_arm_left_joint_7
      - astribot_arm_right_joint_1
      - astribot_arm_right_joint_2
      - astribot_arm_right_joint_3
      - astribot_arm_right_joint_4
      - astribot_arm_right_joint_5
      - astribot_arm_right_joint_6
      - astribot_arm_right_joint_7
      - wheel_RF_Joint
      - wheel_LF_Joint
      - wheel_RR_Joint
      - wheel_LR_Joint
      - astribot_gripper_left_joint_L1
      - astribot_gripper_right_joint_L1
    interfaces:
      - position
      - velocity
      - effort

torso_controller:
  ros__parameters:
    joints:
      - astribot_torso_joint_1
      - astribot_torso_joint_2
      - astribot_torso_joint_3
      - astribot_torso_joint_4
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5

head_controller:
  ros__parameters:
    joints:
      - astribot_head_joint_1
      - astribot_head_joint_2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5

arm_left_controller:
  ros__parameters:
    joints:
      - astribot_arm_left_joint_1
      - astribot_arm_left_joint_2
      - astribot_arm_left_joint_3
      - astribot_arm_left_joint_4
      - astribot_arm_left_joint_5
      - astribot_arm_left_joint_6
      - astribot_arm_left_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5

arm_right_controller:
  ros__parameters:
    joints:
      - astribot_arm_right_joint_1
      - astribot_arm_right_joint_2
      - astribot_arm_right_joint_3
      - astribot_arm_right_joint_4
      - astribot_arm_right_joint_5
      - astribot_arm_right_joint_6
      - astribot_arm_right_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5

gripper_left_controller:
  ros__parameters:
    joints:
      - astribot_gripper_left_joint_L1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 1.0

gripper_right_controller:
  ros__parameters:
    joints:
      - astribot_gripper_right_joint_L1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 1.0

wheel_effort_controller:
  ros__parameters:
    joints:
      - wheel_RF_Joint
      - wheel_LF_Joint
      - wheel_RR_Joint
      - wheel_LR_Joint
    interface_name: effort
