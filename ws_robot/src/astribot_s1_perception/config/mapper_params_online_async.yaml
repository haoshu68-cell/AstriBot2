# SLAM Toolbox —— 在线建图模式参数（对应官方 online_async_launch.py 的
# slam_params_file）。base_frame/odom_frame 与本机器人现有 TF 树对齐，
# 不需要额外加坐标系别名。
slam_toolbox:
  ros__parameters:

    # ---- 坐标系（对接本机器人已有的 TF 链路，odom -> astribot_torso_base 见
    #      astribot_s1.gazebo.xacro 里的 MecanumDrive/OdometryPublisher 插件） ----
    odom_frame: odom
    map_frame: map
    base_frame: astribot_torso_base
    # 注意：这里是单层的 /scan（pointcloud_to_laserscan，min_height 0.05 / max_height 0.6，
    # use_inf: true），**不是**四层切片的 /scan_from_cloud。
    # 也就是说多层高度切片感知只进了 Nav2 costmap，没进 SLAM ——
    # 矮托盘(离地5~25cm)和悬空横梁在代价地图里有、在这张 SLAM 地图里没有。
    # 这是已知遗留，改它要和下面的 max_laser_range 联动，
    # 详见 astribot_s1_autonomy/README.md「已知遗留」一节。
    scan_topic: /scan
    mode: mapping

    # ---- 建图相关 ----
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    # 融合点云投影出的 2D scan 最远距离要覆盖到 pointcloud_to_laserscan 的
    # range_max（见 config 里同名参数），两边不一致会导致远处障碍物在 SLAM 里被裁掉。
    #
    # !!! 但「恰好相等」有个隐蔽副作用 !!!
    # Karto 只对落在半开区间 [rangeThreshold, maxRange) 内的读数「沿途碾出自由空间」
    # （OccupancyGrid::AddScan, Karto.h:6167；>= maxRange 的整条丢掉）。
    # maxRange 取自 scan 消息的 range_max，rangeThreshold = clip(本参数, min, max)。
    # 本参数 20.0 == scan 的 range_max 20.0 → 区间为空 →
    # **无回波方向永远碾不出自由空间**，/map 的自由空间只来自真有回波的方向
    # （实测 723 束里仅 245 束有回波）。机器人静止时已知区只有约 1.4m 半径。
    # 要修必须降到 range_max 以下（如 12.0）并同时新增一档无回波值，
    # 详见 astribot_s1_autonomy/README.md「已知遗留」一节。不要只改这一处。
    max_laser_range: 20.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # ---- 匹配器参数（官方推荐默认值，仓储室内低速场景不需要特别调） ----
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---- 关联性扫描匹配（Correlation Scan Match） ----
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ---- 里程计/激光噪声模型 ----
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
