pointcloud_to_laserscan:
  ros__parameters:
    target_frame: astribot_torso_base
    transform_tolerance: 0.02
    min_height: 0.05
    max_height: 0.6
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087  # 0.5度，约720线，仓储场景足够
    scan_time: 0.1
    range_min: 0.35
    range_max: 20.0
    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 1
