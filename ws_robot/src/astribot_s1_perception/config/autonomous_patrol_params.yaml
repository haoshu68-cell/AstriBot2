# 自主巡游节点(autonomous_patrol_node)参数。
# 反应式漫游策略：不是 Nav2 前沿探索，而是"每周期找最开阔方向直接平移过去+缓慢自转"，
# 利用 X 型布局全向轮底盘的特点简化实现，见 autonomous_patrol_node.py 文件头部说明。
#
# !!! 实测踩坑记录 !!!：早期版本（max_linear_speed=0.35, front_safety_distance=0.6,
# cornered_distance=0.8）在短时测试里表现正常，但长时间无人值守连续巡游后发现机器人
# 撞上仓储货架导致仿真物理异常（VelocityControl 强行维持速度指令、不理会碰撞反作用力，
# 详见 autonomous_patrol_node.py 文件头部"安全阀"说明）。
#
# !!! 第二轮实测踩坑记录（更关键）!!!：把速度调低、安全距离调大之后重新测试，
# 又实测复现了一次新的问题——机器人撞上货架支腿后卡在约18°俯仰角的倾斜姿态里不再
# 移动，但没触发当时的安全监控阈值（max_height_deviation=0.15/max_tilt_rad=0.35）。
# 排查后发现是两个独立问题的叠加：(1) 碰撞检测的"安全扇区"写死判断车体正前方(角度0)，
# 而全向轮选定的移动方向 best_angle 可能完全是另一个方向，等于对真正要走的方向
# "盲开"——已修复为让安全扇区跟着 best_angle 走，并新增不分方向的全向最近距离
# 紧急阈值(critical_stop_distance)；(2) 安全监控阈值本身也偏松——已收紧
# max_height_deviation/max_tilt_rad，让"卡住但暂时没有持续恶化"的情况也能被尽早
# 止损。这是两次真实碰撞测试驱动出来的修复，不是纸面推演。
autonomous_patrol_node:
  ros__parameters:
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom
    control_period: 0.2
    max_linear_speed: 0.25
    yaw_rate: 0.12
    front_safety_distance: 0.9
    front_arc_deg: 70.0
    cornered_distance: 1.1
    critical_stop_distance: 0.4
    max_target_range: 6.0
    smoothing_alpha: 0.25
    normal_height: 0.134
    max_height_deviation: 0.06
    max_tilt_rad: 0.12

