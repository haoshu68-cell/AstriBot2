# 双 Livox Mid-360 安装外参记录。
#
# !!! 唯一权威数据源是 astribot_s1_description/urdf/astribot_s1.xacro 里的
#     livox_left_xyz / livox_left_rpy / livox_right_xyz / livox_right_rpy 四个 xacro:arg !!!
# 本文件只是把同一份数值以更适合标定/现场核对的 yaml 格式再记录一遍，方便：
#   1) 现场标定后核对/回填新的外参数值；
#   2) 不需要打开 xacro 也能快速查安装位姿；
#   3) 后续如果做真实的多雷达外参标定工具，标定结果先写在这里，再手动同步回 xacro。
#      本方案暂未提供自动转换脚本，改动后请记得两边保持一致。
#
# 坐标约定：以 astribot_torso_base 为参考系，+x 朝前、+y 朝左、+z 朝上，
# rpy 为绕 x/y/z 轴的欧拉角（弧度，urdf/xacro 惯例：先绕x(roll)、再绕y(pitch)、再绕z(yaw)）。
#
# ════════════════ 2026-09-01 按实机标定修正 ════════════════
# 原记录（left 0.28 0.18 0.10 / rpy 0 0 0.4；right -0.28 -0.18 0.10 / rpy 0 0 2.74）
# 是 xacro 宏的**占位默认值**，从未按实机量过，与实测差 0.108m / 68.8°。
#
# 修正后数值的来源与三条交叉校验：
#   1. 厂商标定文件（权威，标定工具 livox_lidar_calib 写入）：
#      /opt/astribot_ros/software/livox_ros_driver2/share/config/MID360_config.json
#      lidar[1] (IP 192.168.0.13 = back) 相对 lidar[0] (IP .12 = front)：
#        xyz = (1, -496, 84) mm      rpy = (0.0669°, -0.5368°, -178.195°)
#      ⚠️ 驱动用 SetLivoxLidarInstallAttitude 把这份外参**写进雷达设备本身**
#         （livox_lidar_callback.cpp:96-106），所以 /livox/lidar_back 发布的点
#         已经在 front 的坐标系里了。不要在上层再变换一次。
#   2. SLAM mid360.yaml 的 chassis_extrinsic_*（front → chassis）：
#        T = (0.17393, 0.16893, 0.082)   R = Rz(-0.800058 rad = -45.84°)
#   3. 实测（motion-free，点云地面拟合）验证 (2) 里的 chassis 就是 astribot_torso_base：
#        front 雷达离地   实测 0.1745 m  vs 由 (1)(2) 推出的 0.1770 m   差 2.5 mm
#        两路报出的地面高度差                                          0.6 mm
#        雷达倾角        实测 0.43°（外参是纯 Rz，预期 0°）
#        两雷达连线中点  算得 (-0.0036, -0.0042) → 底盘中心确在两者正中
#        两雷达间距      算得 0.5031 m vs 厂商标定 0.496 m              差 7 mm
#        两雷达高度差    算得 0.0840 m vs 厂商标定 0.084 m              一致
#
# 命名对应（两套命名并存，容易踩）：
#   livox_mid360_left  = /livox/lidar_front = IP 192.168.0.12  = 标定基准
#   livox_mid360_right = /livox/lidar_back  = IP 192.168.0.13
#
# 已知遗留问题（未处理）：无回波点在设备内被外参映射到固定坐标，
# back 有约 34% 的点堆在 (0.001, -0.496, 0.084)、front 约 33% 堆在原点。
# 它们落在机器人足迹内，自滤不正确时会被当成障碍物。

livox_mid360_left:
  parent_frame: astribot_torso_base
  mount_position: 左前（= lidar_front，IP 192.168.0.12，标定基准）
  xyz: [0.17393, 0.16893, 0.082]
  rpy: [0.0, 0.0, -0.800058]

livox_mid360_right:
  parent_frame: astribot_torso_base
  mount_position: 右后（= lidar_back，IP 192.168.0.13）
  xyz: [-0.18120, -0.17733, 0.166]
  rpy: [0.001168, -0.009370, 2.373036]
