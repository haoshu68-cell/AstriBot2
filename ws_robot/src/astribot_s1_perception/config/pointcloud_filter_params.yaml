# 点云预处理参数（livox_preprocess_node），左右两台雷达各一份 namespace。
# 对应任务书要求：直通滤波、半径滤波、地面点去除，全部可调不写死。
#
# ground_z_min 的取值依据：雷达在自身局部坐标系里，地面大致处于一个固定的负高度
# （传感器装得越高，这个值越负）。本机器人两台 Mid-360 都装在 torso_base 上方 0.10m，
# 而 torso_base 出生高度约 0.10~0.13m（见 astribot_s1_description/config/
# collision_overrides.yaml 的 spawn_height 小节），所以地面在雷达局部系大致在
# z ≈ -0.20 ~ -0.23m 附近；这里取 -0.18 留一点余量（宁可切少一点地面，也不要切掉
# 低矮障碍物），实际部署 / 换了安装高度后需要重新估算这个值。
#
# !!! 实测踩坑记录（range_min，非常关键）!!!：自主巡游联调时发现机器人不管在仓库
# 什么位置，激光扫描永远 100% 的有效读数都聚在 0.15~0.25m 这个区间——用一个独立探针
# 脚本直接订阅 /livox/lidar_left 原始点云查最近点，确认这是打在机器人自己身上的
# 固定结构（八成是躯干支架/雷达自己的安装座边缘，坐标在传感器局部系里紧紧聚成一小簇，
# 不是环境障碍物；如果是真实环境障碍物，不可能360°各个方向都恰好在这个距离）。
# 原来的 range_min=0.15 只挡住了最近的一小簇(~0.10m)，挡不住第二簇自撞点(~0.18-0.25m)，
# 导致巡游节点的"最开阔方向"逻辑看到的全是"到处都很近"，一直误判成被困在角落里，
# 只会原地自转、完全走不出去（不是货架撞击导致的，是激光雷达一直在"看见自己"）。
# 调大 range_min 让近距离自撞点被滤掉，同时仍保留 0.35m 以外真实障碍物的探测能力——
# 这个数值比 Livox Mid-360 实机标称盲区(约0.1~0.2m)更大，是专门针对"本机安装位置
# 距离机身结构较近"这个具体情况留出的安全余量，不是随便拍的。

/livox_preprocess_left:
  ros__parameters:
    range_min: 0.35
    range_max: 35.0
    ground_z_min: -0.18
    height_max: 3.0
    voxel_size: 0.15
    min_points_per_voxel: 2

/livox_preprocess_right:
  ros__parameters:
    range_min: 0.35
    range_max: 35.0
    ground_z_min: -0.18
    height_max: 3.0
    voxel_size: 0.15
    min_points_per_voxel: 2

