# 点云预处理参数（livox_preprocess_node），左右两台雷达各一份 namespace。
# 对应任务书要求：直通滤波、半径滤波、地面点去除，全部可调不写死。
#
# ground_z_min 的取值依据：本节点**不查 TF**（livox_preprocess_node.py:80 是
# `points[:,2] >= ground_z_min`），阈值直接作用在**雷达自身局部坐标系**的原始 z 上。
# 所以它的物理含义 = 「地面在该雷达局部系的 z」+「想保留的离地余量」，
# **雷达装得越高，这个值就必须越负**，而且两台装得不一样高时**必须给不同的值**。
#
# ════════ 2026-09-01：两台不再同高，共用一个值在数学上不可能同时正确 ════════
# 旧布局两台都在 torso_base 上方 0.10m，所以共用 -0.18 是可行的。
# 新布局（astribot_s1.xacro 的 livox_left/right_xyz，按实机标定修正）：
#     left/front  安装 z = 0.082
#     right/back  安装 z = 0.166        ← 比 front 高 84mm
# 地面在 torso_base 系为 z = -0.095（**不是 -0.080**；-0.0805 那个旧值是漏乘
# joint rpy 算出来的，见 docs/slam_nav_dataflow_and_datum.md 的更正）。
#
# 继续共用 -0.18 的后果（两侧朝**相反方向**坏）：
#     雷达        地面在其局部系   -0.18 实际切在离地   后果
#     旧(同高0.100)   -0.1950        +0.0150       ✅ 原意
#     left  (0.082)   -0.1770        -0.0030       ❌ 阈值落到地面**下方**，地面点完全不再剔除
#     right (0.166)   -0.2610        +0.0810       ❌ 离地 8.1cm 以下全被删
#
# right 那侧是**不可恢复的数据损失**：滤在采集阶段，下游拿不回来。而
# pointcloud_slice_scan_params.yaml 的 low_obstacle 层声称覆盖离地 5~25cm
# （托盘/踏板/纸箱底），后雷达现在发不出 8.1cm 以下任何点，这一层被削掉一半。
#
# 现在按「各自保留离地 +0.015m 以上」反算（与旧布局的原意等价）：
#     left  : -0.095 - 0.082 + 0.015 = -0.1620
#     right : -0.095 - 0.166 + 0.015 = -0.2460
#
# ⚠️ 改雷达安装高度时**必须同步改这两个值**，公式：
#       ground_z_min = 地面在 torso_base 的 z(-0.095) - 该雷达安装 z + 0.015
#    漏改不会报错，只会静默丢数据或静默不滤地面。
#
# !!! 实测踩坑记录（range_min，非常关键）!!!：自主巡游联调时发现机器人不管在仓库
# 什么位置，激光扫描永远 100% 的有效读数都聚在 0.15~0.25m 这个区间——用一个独立探针
# 脚本直接订阅 /livox/lidar_left 原始点云查最近点，确认这是打在机器人自己身上的
# 固定结构（八成是躯干支架/雷达自己的安装座边缘，坐标在传感器局部系里紧紧聚成一小簇，
# 不是环境障碍物；如果是真实环境障碍物，不可能360°各个方向都恰好在这个距离）。
# 原来的 range_min=0.15 只挡住了最近的一小簇(~0.10m)，挡不住第二簇自撞点(~0.18-0.25m)，
# 导致巡游节点的"最开阔方向"逻辑看到的全是"到处都很近"，一直误判成被困在角落里，
# 只会原地自转、完全走不出去（不是货架撞击导致的，是激光雷达一直在"看见自己"）。
# 调大 range_min 让近距离自撞点被滤掉，同时仍保留 0.35m 以外真实障碍物的探测能力——
# 这个数值比 Livox Mid-360 实机标称盲区(约0.1~0.2m)更大，是专门针对"本机安装位置
# 距离机身结构较近"这个具体情况留出的安全余量，不是随便拍的。

/livox_preprocess_left:
  ros__parameters:
    range_min: 0.35
    range_max: 35.0
    # left/front 安装 z=0.082 -> 地面在其局部系 -0.1770，保留离地 1.5cm 以上
    ground_z_min: -0.1620
    height_max: 3.0
    voxel_size: 0.15
    min_points_per_voxel: 2

/livox_preprocess_right:
  ros__parameters:
    range_min: 0.35
    range_max: 35.0
    # right/back 安装 z=0.166（比 front 高 84mm）-> 地面在其局部系 -0.2610
    # 这里**必须**比 left 更负，共用 left 的值会把离地 8.1cm 以下全删掉
    ground_z_min: -0.2460
    height_max: 3.0
    voxel_size: 0.15
    min_points_per_voxel: 2

