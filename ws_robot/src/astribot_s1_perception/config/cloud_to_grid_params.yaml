# cloud_to_grid_node 参数：把 Voxel-SLAM 的点云投影成 OccupancyGrid。
#
# ⚠️ 键名必须是节点的**运行时**名字。launch 里给节点做 `name=` remap 是进程级的，
# remap 之后 yaml 键匹配不上，**整份文件静默失效**、所有参数回落到代码默认值，
# 且没有任何报错。所以用 `/**:` 通配前缀兜底。
#
# ⚠️ 每个 IncludeLaunchDescription 都必须显式传 params_file，否则共享上下文里的
# 名字会被第一个 include 抢占，后面的节点静默加载错的 yaml。
#
# ============ Voxel-SLAM 实际提供的接口（已与源码核对） ============
# 位姿：只走 TF，**没有** nav_msgs/Odometry 话题
#   /tf   geometry_msgs/TransformStamped
#         header.frame_id = "camera_init"   世界系，原点 = 底盘启动位姿
#         child_frame_id  = "aft_mapped"    **底盘中心**
#         （SLAM 内部已用 chassis_extrinsic_tran/rota 从 IMU 位姿换算，
#           见 voxelslam.cpp:38-42 + mid360.yaml:19-20，实机已配置故真实生效）
#         ⚠️ stamp 用 rclcpp::Clock().now()，是**发布时刻**而非扫描时刻，
#           且忽略 use_sim_time
# 点云：
#   /map_scan_filtered   sensor_msgs/PointCloud2   frame_id = camera_init
#         有效字段 x/y/z（float32，**世界系**，已按 0.05~1.63m 过滤）
#         无效字段 intensity/normal_x/normal_y/normal_z/curvature（未赋值）
#         无序：height=1，width=点数，is_dense 未显式设置

/**:
  ros__parameters:
    # ================= 入 =================
    # /map_scan_filtered 是**给导航用的实时障碍点云**，已在 SLAM 侧做过高度 ROI。
    #
    # ⚠️ 不要用 /map_cmap：那是全量地图（含 previous_map 加载的 1floor 旧会话），
    #    不是实时障碍，而且**没有**做高度过滤。
    cloud_topic: "/map_scan_filtered"

    cloud_frame_override: ""

    # ================= 出 =================
    publish_directly: true
    map_topic: "/map"
    intermediate_map_topic: "/slam/map"

    # 默认直接用 camera_init 当地图系，省掉一条恒等静态 TF。
    # ⚠️ 若上层要求 frame 名必须叫 map，改这里**不够** —— 还要补一条
    #    map→camera_init 的静态 TF，否则查 map→aft_mapped 必然失败
    #    → 不雕刻 → free_cells=0 → nav2 无法规划。
    map_frame: "camera_init"

    # ================= 投影 =================
    # 必须与 nav2_params_rpp.yaml 的 global_costmap resolution 一致。
    resolution: 0.05

    # ⚠️⚠️ z 切片默认**放通**（-inf, +inf），刻意如此，改之前请读完这段。
    #
    # /map_scan_filtered 已在 SLAM 侧按 [nav_scan_z_min, nav_scan_z_max]
    # = [0.05, 1.63] 过滤过。我们再切一刀就是**两层过滤串联取交集**。
    #
    # 已量化的危害（离线实测，5 个覆盖 0.10~1.60m 的障碍点）：
    #     放通 (-inf, inf)     保留 5 / 丢弃 0
    #     旧默认 [-0.05, 0.60] 保留 2 / 丢弃 3   → **丢掉 60% 的障碍点**
    # 丢掉的是 0.95 / 1.55 / 1.60m 那三个 —— 人体躯干、桌面、台面高度。
    # 这些障碍在地图上**看不出来**，机器人会直接撞过去。
    #
    # 本仓库踩过同形态的坑：两个包各一层限速，0.50×0.15=0.075，
    # 只改一个看不到效果，根因在另一个包里。
    #
    # 节点启动时会主动检查：若订阅的是 *scan_filtered 话题而这里又收紧了，
    # 会打一条明确的 WARNING 并说出丢掉的区间。
    #
    # 什么时候才该收紧：订阅未过滤的话题（如 /map_scan），
    # 或确实需要比 SLAM 更严的区间。改之前先核对 SLAM 侧的 nav_scan_z_* 值。
    z_min: -.inf
    z_max: .inf

    # 一个格子里至少几个点才算占据。1 会让单个噪点变成障碍。
    min_points_per_cell: 2

    padding_m: 1.0

    # 栅格总数上限。撑爆会抛 GridConfigError 并以退出码 2 结束。
    max_cells: 4000000

    # ================= 空闲空间雕刻 =================
    # ⚠️ **不雕就没有空闲格。** 已离线实测：同一份点云
    #      不给 sensor_xy → free=0    occupied=1  unknown=2459
    #      给了 sensor_xy → free=4711 occupied=2  unknown=167
    #    free_cells=0 时 nav2 无法规划，且探索协调器会把每个前沿候选都判为
    #    不可站（前沿必须在自由空间边上）。症状会表现成
    #    "Starting point in lethal space"，离根因好几层。
    carve_free_space: true

    carve_max_range_m: 8.0

    # 固定角射线数。360 = 每度一条。代价与占据格数**无关**
    # （旧的 O(位姿×占据格) 实现在真实规模下跑不完，已重写并加了回归测试）。
    carve_n_rays: 360

    # 传感器（=底盘中心）在地图系的位置从 TF 取。
    # Voxel-SLAM 发的是 camera_init→aft_mapped，所以取 aft_mapped。
    sensor_frame: "aft_mapped"

    # ⚠️ SLAM 的 TF stamp 是**发布时刻**而非扫描时刻，与点云 stamp 未必对齐，
    #    所以这个超时不能太小，否则会频繁 ExtrapolationException → 不雕刻。
    tf_timeout_sec: 0.5

    # ================= 行为 =================
    # 必须 < 协调器(autonomous_patrol_node) 的 map_timeout_sec=10.0。
    # 协调器按**本地到达时间**判超时，场景静止时 SLAM 可能长时间不发新点云。
    republish_period_sec: 5.0

    # 这么久没成功投影任何一帧就非零退出，不静默等待。
    source_timeout_sec: 60.0

    # 两次投影的最小间隔。投影真实规模的图是秒级（实测 4.84s / 3367 位姿），
    # 不限流回调会堆积，越拖越久最后完全跟不上。
    min_interval_sec: 2.0

    report_period_sec: 10.0

cloud_to_grid:
  ros__parameters:
    cloud_topic: "/map_scan_filtered"
    map_frame: "camera_init"
    publish_directly: true
    resolution: 0.05
    z_min: -.inf
    z_max: .inf
    carve_free_space: true
    sensor_frame: "aft_mapped"
    republish_period_sec: 5.0
