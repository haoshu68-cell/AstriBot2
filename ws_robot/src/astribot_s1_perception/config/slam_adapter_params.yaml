# 外部 SLAM 接入层（slam_adapter_node）参数。
#
# ⚠️ 键名必须是节点的**运行时**名字。本仓库踩过这个坑：launch 里给节点做
# `name=` remap 是进程级的，remap 之后 yaml 的键匹配不上，**整份文件静默失效**、
# 所有参数回落到代码里的 declare 默认值，且没有任何报错。
# 所以本文件用 `/**:` 通配前缀兜底，同时保留具名段作为文档。
#
# ⚠️ 每个 IncludeLaunchDescription 都必须显式传 params_file。共享上下文里的
# params_file 名字会被第一个 include 抢占，后面的节点静默加载错的 yaml。

/**:
  ros__parameters:
    # ---- 入：外部 SLAM 那一侧 ----
    # 由 §2.2 的 probe_slam.sh 探测填写。默认值是猜的，上线前必须核对：
    #   ros2 topic list | grep -i map
    #   ros2 topic info <名字> --verbose     # 看类型与 QoS
    source_map_topic: "/slam/map"

    # auto | transient_local | volatile
    # auto = 先按 transient_local 订阅，8s 无消息则补一个 volatile 订阅并 WARN。
    # 探明之后请显式写死，别长期依赖退化路径 —— 退化多花 8s，
    # 而 TRANSIENT_LOCAL 订阅端与 VOLATILE 发布端不兼容时是零消息零报错。
    source_map_qos: "auto"

    source_map_frame: "map"

    # ---- 出：下游硬依赖，不要改 ----
    map_topic: "/map"
    map_frame: "map"
    odom_frame: "odom"

    # ---- 行为 ----
    # 必须 < 协调器(autonomous_patrol_node) 的 map_timeout_sec=10.0，
    # 否则协调器在两次心跳之间判超时并停止派发前沿：
    # 症状是"探索偶发停住"而 /map 一直有数据。构造期会校验这一条。
    republish_period_sec: 5.0

    # 注：本节点**不再发任何 TF**。map→odom 改由 map_odom_tf_node 负责，
    # 它做 REP-105 分解 map→odom = (SLAM 的 map→base) ∘ (odom→base)⁻¹。
    # 旧的 publish_map_to_odom_tf 参数已删除 —— 它发的是**单位变换**，
    # 等于宣称"odom 原点就是 map 原点"，只在开机即建图那一种情形下成立。

    # true = 契约违规则非零退出，不转发坏数据。
    # 只在"先看看上游到底发了什么"时才临时置 false（那时也只 WARN、仍不转发）。
    strict_contract: true

    # 收不到源地图就非零退出，不静默等待 —— 静默等待会让 nav2 卡在启动，
    # 而真正的原因在这一层。
    source_timeout_sec: 30.0

    # 本仓库多处距离阈值按 0.05 定过口径（前沿的 goal_unknown_clearance_radius
    # 必须为 0 就是其一），分辨率一变那些阈值全部失去意义。
    resolution_expected: 0.05

    # true = data 只允许 {-1, 0, 100}。上游用中间值表达占据概率时置 false，
    # 并同步确认 nav2 的 lethal_cost_threshold 与之相符。
    strict_cell_values: true

    report_period_sec: 10.0

# 具名段：节点名保持默认 `slam_adapter` 时生效。留着是为了让"参数属于谁"可读。
slam_adapter:
  ros__parameters:
    source_map_topic: "/slam/map"
    source_map_qos: "auto"
    republish_period_sec: 5.0
    strict_contract: true
    source_timeout_sec: 30.0
