
/**:
  ros__parameters:
    part_name: "astribot_chassis"      # astribot_base.py:11
    freq: 100.0

    input_frame: "body"
    theta_reference: "at_enable"        # 203:39-42，以使能时刻 theta 为零点

    start_disabled: true               # 启动后不自动使能，需显式调 ~/enable

    cmd_vel_timeout_sec: 0.3           # 超时立即速度置零

    max_vel_xy: 1.0
    max_vel_theta: 2.0
    max_accel_xy: 2.5
    max_accel_theta: 3.2

    max_accel_xy_up: 0.35

    max_tick_dt_sec: 0.04

    leash_xy_m: 10.0
    leash_theta_rad: 10.0
    require_manual_reset: true         # true=必须调 ~/reset_leash 才恢复

    enable_slam_correction: false      # 兼容参数；true 已拒绝，反馈控制由 Nav2 负责
    pose_source: "slam"
    map_frame: "map"
    base_frame: "astribot_torso_base"  # 本机根 frame，没有 base_link
    outer_rate: 10.0
    slam_max_age_sec: 0.5
    slam_jump_threshold_m: 0.30

    require_slam_to_enable: false
    slam_loss_grace_sec: 2.0

    odom_drift_window_sec: 2.0
    odom_drift_warn_m: 0.15            # 待 G0-f 给出实测依据后复核

    declared_target: "sim"             # sim | real，由 launch 传入
    allow_unsafe_mode: false           # 仅 safe 模式允许写
