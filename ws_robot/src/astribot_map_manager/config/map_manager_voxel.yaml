map_manager:
  ros__parameters:
    robot_id: astribot
    storage_root: ""  # XDG_DATA_HOME/astribot/map_catalog or ~/.local/share/astribot/map_catalog
    import_root: /tmp/astribot_slam_sessions
    odom_topic: /odom
    verification_timeout_sec: 180.0
    adapter_service: /map_session_adapter/command
    adapter_status: /map_session_adapter/status
