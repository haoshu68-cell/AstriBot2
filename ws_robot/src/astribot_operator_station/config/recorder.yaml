diagnostics_recorder:
  ros__parameters:
    output_root: /tmp/astribot_incidents
    robot_id: unknown
    deployment_revision: unknown
    min_free_bytes: 1073741824
    topic_stale_sec: 3.0
    topics:
      - /clock
      - /tf
      - /tf_static
      - /odom
      - /joint_states
      - /arm_left_controller/state
      - /transport/execution_guard/status
      - /wheel_effort_controller/commands
      - /map
      - /map_nav
      - /plan
      - /cmd_vel
      - /cmd_vel_nav_body_raw
      - /speed_limit
      - /global_costmap/costmap
      - /local_costmap/costmap
      - /navigation/robot_envelope
      - /navigation/geometry_state
      - /navigation/envelope_v2
      - /navigation/envelope_applied
      - /navigation/arm_hold
      - /navigation_policy/path_risk
      - /path_tracking/path_quality
      - /navigation/execution_status
      - /navigation/policy_status
      - /navigation/sensor_health
      - /simulation/left_arm_contacts
      - /navigation_policy/state
      - /navigation_policy/constraint
      - /navigation_policy/observation
      - /loop_route_executor/status
      - /mapping_session/status
      - /operator_backend/status
      - /operator_backend/events
      - /operator/arm_preview
      - /transport/status
      - /simulation_transport/status
      - /model/transport_box_01/kinematic_attachment/state
      - /mapping_runtime/status
      - /map_session_adapter/status
      - /map_manager/status
      - /map_manager/events
      - /exploration/state
      - /exploration_coordinator_node/operator_status
      - /exploration_coordinator_node/command_events
    # Explicit allowlist; missing names are recorded as unavailable, never replaced by defaults.
    parameters:
      - /exploration_coordinator_node:require_fixed_envelope
      - /transport_mtc_planner:max_velocity_scaling
      - /transport_mtc_planner:max_acceleration_scaling
      - /transport_mtc_planner:joint_limit_margin_rad
      - /manipulation_execution_guard:maximum_joint_error_rad
      - /omni_effort_drive_node:idle_position_hold
      - /omni_effort_drive_node:idle_position_kp
      - /omni_effort_drive_node:control_period_sec
      - /omni_effort_drive_node:wheel_effort_limit_nm
      - /move_group:capabilities
      - /move_group:disable_capabilities
      - /transport_fault_acceptance:fault_mode
      - /transport_fault_acceptance:fault_stage
      - /transport_fault_acceptance:minimum_joint_speed_radps
