/**:
  ros__parameters:
    input_cloud_topic: /map_scan_filtered
    output_scan_topic: /scan_from_cloud
    filtered_cloud_topic: /livox/cloud_self_filtered
    marker_topic: ~/debug_markers
    base_frame: astribot_torso_base
    tf_timeout_sec: 0.15
    tf_total_budget_sec: 0.3
    max_cloud_age_sec: 0.3
    tf_time_tolerance_sec: 0.1
    enable_voxel_filter: true
    voxel_leaf_size: 0.03
    enable_outlier_filter: true
    outlier_mean_k: 12
    outlier_stddev_mul: 2.0
    min_valid_points: 20
    watchdog_period_sec: 0.5
    input_timeout_sec: 1.0
    invalid_input_policy: hold_last
    publish_markers: true
    marker_point_stride: 3
    scan:
      angle_min: -3.14159265
      angle_max: 3.14159265
      angle_increment: 0.0087
      range_min: 0.35
      range_max: 20.0
      scan_time: 0.1
      no_return_mode: range_max
    slice_names:
    - low_obstacle
    - main_nav
    - torso_high
    - overhead
    slices:
      low_obstacle:
        z_min: -0.03
        z_max: 0.17
        min_points: 2
        max_range: 6.0
        enabled: true
      main_nav:
        z_min: 0.17
        z_max: 0.6
        min_points: 1
        max_range: 20.0
        enabled: true
      torso_high:
        z_min: 0.6
        z_max: 1.1
        min_points: 1
        max_range: 20.0
        enabled: true
      overhead:
        z_min: 1.1
        z_max: 1.55
        min_points: 2
        max_range: 8.0
        enabled: true
