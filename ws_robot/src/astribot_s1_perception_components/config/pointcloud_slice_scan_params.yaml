/**:
  ros__parameters:

    input_cloud_topic: "/livox/fused_points"
    output_scan_topic: "/scan_from_cloud"
    filtered_cloud_topic: "/livox/cloud_self_filtered"
    marker_topic: "~/debug_markers"
    base_frame: "astribot_torso_base"

    tf_timeout_sec: 0.15          # TF 查询超时，超时即丢帧等 TF 恢复
    tf_total_budget_sec: 0.30
    max_cloud_age_sec: 0.30       # 点云时间戳与当前时刻偏差上限
    tf_time_tolerance_sec: 0.10   # 点云时间戳与 TF 时间戳偏差上限，防时间错位造成假障碍

    enable_voxel_filter: true
    voxel_leaf_size: 0.03         # 3cm 体素：仓储尺度下足够，且能把 Mid360 的点数降一个量级
    enable_outlier_filter: true
    outlier_mean_k: 12            # 统计离群点滤波近邻数
    outlier_stddev_mul: 2.0       # 标准差倍数，越小滤得越狠

    min_valid_points: 20          # 剔除自身点后不足该数量，本帧判为不可信（不是「前方无障碍」）
    watchdog_period_sec: 0.5
    input_timeout_sec: 1.0
    invalid_input_policy: "hold_last"

    publish_markers: true
    marker_point_stride: 3        # Marker 点抽稀，1=全发（RViz 会很卡）

    scan:
      angle_min: -3.14159265
      angle_max: 3.14159265
      angle_increment: 0.0087     # 0.5°，约 722 束，和既有 pointcloud_to_laserscan 保持一致
      range_min: 0.35             # 小于该距离的点全部丢弃（本体附近交给自身剔除处理）
      range_max: 20.0
      scan_time: 0.1
      no_return_mode: "range_max"

    slice_names: ["low_obstacle", "main_nav", "torso_high", "overhead"]

    slices:
      low_obstacle:
        z_min: -0.03              # 离地 5cm：地面在 -0.080，向上留 5cm 余量把地面点排除
        z_max: 0.17               # 离地 25cm
        min_points: 2
        max_range: 6.0            # 只信 6m 内，远处贴地点多为地面误判
        enabled: true
      main_nav:
        z_min: 0.17               # 离地 25cm
        z_max: 0.60               # 离地 68cm
        min_points: 1
        max_range: 20.0           # 主力层放到全量程
        enabled: true
      torso_high:
        z_min: 0.60               # 离地 68cm
        z_max: 1.10               # 离地 1.18m
        min_points: 1
        max_range: 20.0           # 跟主力层一致，让全局代价地图也拿到远处结构
        enabled: true
      overhead:
        z_min: 1.10               # 离地 1.18m
        z_max: 1.55               # 离地 1.63m，超过整机高度的点不关心
        min_points: 2
        max_range: 8.0
        enabled: true

    self_filter:
      footprint:
        enabled: true
        radius: 0.44
        z_min: -0.20              # 盖到地面(-0.080)以下，确保轮子和底盘裙边都被剔掉
        z_max: 0.20               # 盖住 visual 网格顶面 0.1776，留 2cm 余量

      chain_names: ["torso", "head", "arm_left", "arm_right", "gripper_left", "gripper_right"]

      chains:
        torso:
          radius: 0.20
          frames:
            - "astribot_torso_base"
            - "astribot_torso_link_1"
            - "astribot_torso_link_2"
            - "astribot_torso_link_3"
            - "astribot_torso_link_4"
            - "astribot_torso_end_effector"

        head:
          radius: 0.18
          frames:
            - "astribot_head_base_link"
            - "astribot_head_link_1"
            - "astribot_head_link_2"

        arm_left:
          radius: 0.15
          frames:
            - "astribot_arm_left_base_link"
            - "astribot_arm_left_link_1"
            - "astribot_arm_left_link_2"
            - "astribot_arm_left_link_3"
            - "astribot_arm_left_link_4"
            - "astribot_arm_left_link_5"
            - "astribot_arm_left_link_6"
            - "astribot_arm_left_link_7"
            - "astribot_arm_left_tool_link"

        arm_right:
          radius: 0.15
          frames:
            - "astribot_arm_right_base_link"
            - "astribot_arm_right_link_1"
            - "astribot_arm_right_link_2"
            - "astribot_arm_right_link_3"
            - "astribot_arm_right_link_4"
            - "astribot_arm_right_link_5"
            - "astribot_arm_right_link_6"
            - "astribot_arm_right_link_7"
            - "astribot_arm_right_tool_link"

        gripper_left:
          radius: 0.10
          frames:
            - "astribot_arm_left_link_7"
            - "astribot_gripper_left_base"
            - "astribot_gripper_left_Link_L11"
            - "astribot_gripper_left_Link_R11"
            - "astribot_arm_left_tcp_link"

        gripper_right:
          radius: 0.10
          frames:
            - "astribot_arm_right_link_7"
            - "astribot_gripper_right_base"
            - "astribot_gripper_right_Link_L11"
            - "astribot_gripper_right_Link_R11"
            - "astribot_arm_right_tcp_link"
