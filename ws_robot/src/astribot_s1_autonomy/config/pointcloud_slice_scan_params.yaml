# =============================================================================
# 感知模块参数：3D 点云多层高度切片投影 → 2D LaserScan
#
# 用 `/**` 通配节点名，这样无论以独立进程还是组件方式加载、无论节点被
# 重命名成什么，参数都能正确匹配（每个 yaml 只会喂给对应的一个节点）。
#
# ！！！坐标系前提（务必先看这一段）！！！
#   本机器人**没有 base_link**。整机根坐标系是 astribot_torso_base
#   （运行时 TF 实测确认，Nav2 的 robot_base_frame 也用的是它）。
#   所有下面的 z 值都是「在 astribot_torso_base 系里的高度」，不是离地高度。
#
#   !!! 地面基准（这条曾经搞错过，后果是地面点漏进最低层变成幽灵障碍物）!!!
#   地面在该系里约为 z = -0.080m。两条独立证据互相印证：
#     · 几何计算：轮心离轴 0.306、球半径 0.080，轮子最低点 = -0.0805（从 URDF 算）
#     · 点云实测：融合点云在本系下的最小 z = -0.0794，最低 0.02m 档位有明显地面峰
#   换算：离地高度 = z + 0.080。
#
#   ⚠ 不要用 odom 报的静止高度 0.1292 去反推地面！那个值参考的不是 torso_base
#   （差 0.049m）。早期按 -0.129 配切片，导致 low_obstacle 下界正好压在地面上。
# =============================================================================
/**:
  ros__parameters:

    # ---------------- 话题与坐标系 ----------------
    # 输入用双雷达融合后的点云（livox_fusion_node 的输出）
    input_cloud_topic: "/livox/fused_points"
    output_scan_topic: "/scan_from_cloud"
    # 剔除自身点后的点云。给 SLAM 出单层 /scan 的 pointcloud_to_laserscan 订阅它，
    # 而不是订阅未过滤的 /livox/fused_points。
    #
    # !!! 为什么必须共用同一份自滤输出（2026-08-20 实测出来的教训）!!!
    # 自滤原来只在本节点内部做，/scan 那条链（pointcloud_to_laserscan）吃的是
    # 未过滤的融合点云。Gate 1 装上夹爪后，夹爪成了**第一个**伸进 p2l 扫描带
    # (z∈[0.05,0.6]) 且距离超过 range_min(0.35) 的机器人自身部件 ——
    # 实测指尖在本体系 (0.062, 0.415, 0.618)，于是 /scan 在 ±90° 冒出 0.414m 回波。
    # 手臂本身在 z=0.745、在带子上方，所以此前一直没暴露。
    # 后果是 SLAM 把这个幻影障碍烙进 /map，全局代价地图的静态层再读进来，
    # 机器人自己那格被膨胀成 INSCRIBED_INFLATED(99/253)，
    # 每次全局规划都报 "Starting point in lethal space!"，
    # 探索的前沿候选 5/5 全被"全局规划失败"丢弃，机器人一步不动。
    # 只修本节点的自滤链**不够**：/scan_from_cloud 干净了，/map 还是脏的。
    filtered_cloud_topic: "/livox/cloud_self_filtered"
    marker_topic: "~/debug_markers"
    base_frame: "astribot_torso_base"

    # ---------------- 时间与 TF 容错 ----------------
    tf_timeout_sec: 0.05          # TF 查询超时，超时即丢帧等 TF 恢复
    max_cloud_age_sec: 0.30       # 点云时间戳与当前时刻偏差上限
    tf_time_tolerance_sec: 0.10   # 点云时间戳与 TF 时间戳偏差上限，防时间错位造成假障碍

    # ---------------- 点云预处理 ----------------
    enable_voxel_filter: true
    voxel_leaf_size: 0.03         # 3cm 体素：仓储尺度下足够，且能把 Mid360 的点数降一个量级
    enable_outlier_filter: true
    outlier_mean_k: 12            # 统计离群点滤波近邻数
    outlier_stddev_mul: 2.0       # 标准差倍数，越小滤得越狠

    # ---------------- 有效性与异常策略 ----------------
    min_valid_points: 20          # 剔除自身点后不足该数量，本帧判为不可信（不是「前方无障碍」）
    watchdog_period_sec: 0.5
    input_timeout_sec: 1.0
    # hold_last  : 输入异常时重发上一帧有效 scan（只刷时间戳），避免 costmap 障碍物闪烁消失
    # stop_output: 干脆停发，让下游自己按传感器超时处理
    invalid_input_policy: "hold_last"

    # ---------------- 调试可视化 ----------------
    publish_markers: true
    marker_point_stride: 3        # Marker 点抽稀，1=全发（RViz 会很卡）

    # ---------------- 输出 LaserScan 的几何 ----------------
    scan:
      angle_min: -3.14159265
      angle_max: 3.14159265
      angle_increment: 0.0087     # 0.5°，约 722 束，和既有 pointcloud_to_laserscan 保持一致
      range_min: 0.35             # 小于该距离的点全部丢弃（本体附近交给自身剔除处理）
      range_max: 20.0
      scan_time: 0.1
      # range_max: 无障碍方向填最大距离（需求规定的默认行为）
      # infinity : 填 inf，与既有 pointcloud_to_laserscan 的 use_inf:=true 行为一致
      #
      # !!! 已知遗留：这两档对 slam_toolbox 都是**静默无效**的 !!!
      # Karto 的 OccupancyGrid::AddScan(Karto.h:6167) 先做这一步：
      #     if (rangeReading >= maxRange) continue;   // 整条读数丢掉
      # 只有落在半开区间 [rangeThreshold, maxRange) 内的读数才会「沿途碾出自由空间」，
      # 其中 maxRange 取自本文件的 range_max，rangeThreshold = clip(max_laser_range, ...)。
      # 而 mapper_params_online_async.yaml 的 max_laser_range: 20.0 恰好 == 下面的
      # range_max: 20.0 —— 区间为空，所以无论填 range_max 还是 inf，
      # /map 都永远不会主动碾自由空间（只有真有回波的方向才有自由空间，实测 245/723 束）。
      #
      # 修它要三处联动（scan 源 + max_laser_range + 新增一档无回波值），
      # 且有 scan matching 退化风险，详见 README.md「已知遗留」一节。不要只改这一处。
      no_return_mode: "range_max"

    # =========================================================================
    # 多层高度切片（需求明确禁止单层切片，这里至少 2 层，程序会强制校验）
    #
    # 分层依据是「不同高度的障碍物对底盘运动的影响不同」：
    #   low_obstacle : 离地 5~25cm。托盘、踏板、纸箱底、地面杂物。
    #                  单层切片方案最容易漏的就是这一档——切在 0.3m 高度时，
    #                  一个 15cm 高的托盘完全不可见，但底盘会直接撞上去。
    #   main_nav     : 离地 25~68cm。货架立柱、墙面、大件障碍，导航主力层。
    #   torso_high   : 离地 68cm~1.18m。桌面、货架横梁、操作台。
    #                  底盘能过但躯干/手臂会撞，必须纳入代价地图。
    #   overhead     : 离地 1.18~1.63m。悬空横梁、门楣。撞头部/上躯干。
    #
    # 融合方式：同一角度桶跨层取最小距离，所以任意高度上最近的那个障碍物
    # 都会体现在最终 scan 上，不存在层间漏检。
    #
    # 每层两个「抗噪/抗误判」旋钮：
    #   min_points: 该角度桶内至少多少点才认账。贴地层给大一点，压制地面反光点。
    #   max_range : 该层的信任距离。贴地层在底盘俯仰时容易把远处地面看成障碍，
    #               所以只信近处；悬空层同理，远处的天花板不该进 costmap。
    # =========================================================================
    slice_names: ["low_obstacle", "main_nav", "torso_high", "overhead"]

    slices:
      low_obstacle:
        z_min: -0.03              # 离地 5cm：地面在 -0.080，向上留 5cm 余量把地面点排除
        z_max: 0.17               # 离地 25cm
        # 贴地层保留 2 个点的证据要求：这一层的误报是"幽灵障碍物"，
        # 会无谓地挡住通路；而且地面反光点恰好集中在这一层。
        min_points: 2
        max_range: 6.0            # 只信 6m 内，远处贴地点多为地面误判
        enabled: true
      main_nav:
        z_min: 0.17               # 离地 25cm
        z_max: 0.60               # 离地 68cm
        # !!! 导航主力层刻意用 min_points: 1 !!!
        # 实测对比 pointcloud_to_laserscan：min_points=2 时有 26 个真实障碍方向被压掉
        # （放开到 1 之后"只有单层看到"的束数 128 -> 102）。Livox 是非重复扫描、
        # 点很稀疏，远处一根细立柱在某个 0.5° 桶里可能只有 1 个点。
        # 在"减少碰撞"这个目标下，漏掉真实障碍物比多报一个噪点危险得多，
        # 所以这一层不要证据数门槛，抗噪交给上游 SOR 和体素滤波。
        min_points: 1
        max_range: 20.0           # 主力层放到全量程
        enabled: true
      torso_high:
        z_min: 0.60               # 离地 68cm
        z_max: 1.10               # 离地 1.18m
        # 同上：桌面/货架横梁这类"底盘能过但躯干会撞"的障碍不能漏
        min_points: 1
        max_range: 20.0           # 跟主力层一致，让全局代价地图也拿到远处结构
        enabled: true
      overhead:
        z_min: 1.10               # 离地 1.18m
        z_max: 1.55               # 离地 1.63m，超过整机高度的点不关心
        # 悬空层保留 2 个点：这里误报会凭空封住一条通路，
        # 而撞到悬空物的概率本身低于撞中间高度的障碍。
        min_points: 2
        max_range: 8.0
        enabled: true

    # =========================================================================
    # 自身点云剔除（底盘 + 双臂 + 躯干 + 头部）
    #
    # 两套机制配合：
    #   footprint: 以 base_frame 原点为轴的竖直圆柱，管底盘和轮子。
    #              它跟着 base_frame 走，底盘俯仰时圆柱一起倾斜，
    #              满足「适配底盘倾斜工况」——不是在固定高度上裁一刀。
    #   chains   : 连杆链。每条链上相邻两个 TF frame 连成一条线段，
    #              套上 radius 变成胶囊体（圆柱+两端半球）。
    #              每帧都用 TF 重新解算，所以机械臂摆到任何姿态，
    #              剔除体都精确跟着连杆走，不存在「静态裁剪」的漏剔/过剔。
    #
    # radius 调参原则：宁可略大也不要过小——漏剔会让机械臂在 costmap 里
    # 画出幽灵障碍物，直接把机器人自己困死；略微过剔的代价只是
    # 手臂正下方的一小块区域看不见，而那块区域本来也被手臂挡住了。
    # 但也别无脑放大：radius 超过 0.3 会开始吃掉手臂旁边的真实障碍物。
    # =========================================================================
    self_filter:
      footprint:
        enabled: true
        # ⚠️ 这两个值必须按 **visual 网格** 配，不能按碰撞体配（2026-09-01 实测教训）。
        #
        # Gazebo 的 gpu_lidar 在渲染场景里做射线求交，打到的是 **visual 网格**；
        # 而碰撞体是给物理引擎的粗简化。两者在本机器人上差得很远：
        #   astribot_torso_base_link.STL (visual)  z∈[-0.0740, +0.1776]  水平半径 0.4202
        #   <cylinder length=0.1 radius=0.3> (碰撞) z∈[-0.0600, +0.0400]  水平半径 0.3000
        #                                                    ↑顶面差 0.1376m，半径差 0.12m
        #
        # 原来 z_max=0.05 是按碰撞体顶面(0.04)配的，于是 z∈(0.05, 0.1776] 这
        # **12.8cm 厚的底盘本体**完全不在剔除体内。实测确认：自滤后仍有 64 个点
        # (0.09%) 落在径向 0.20~0.34m、z≈0.074，跨帧坐标逐字重复 = 静止结构。
        #
        # 危险性在于它与 low_obstacle 切片 z∈[-0.03,0.17] 重叠 0.12m 厚，
        # 唯一挡住它进 /scan 的是 scan.range_min=0.35，而漏点最外到径向 0.34
        # —— **余量只有 1cm**。一旦机器人稍微俯仰或底盘装配公差，就会复现
        # 本文件开头记的那次事故：/scan 冒出本体回波 → SLAM 烙进 /map →
        # 静态层膨胀成 253 → 每次全局规划都 "Starting point in lethal space"。
        #
        # radius: visual 网格水平外接半径实测 0.4202，原来的 0.42 比它还小 0.2mm。
        #         取 0.44 留 2cm 余量（轮子外缘 0.386 也在内）。
        #         代价：径向 0.386~0.44 这个 5.4cm 环带里的真实障碍会被抹掉，
        #         但那本来已经贴在轮子上、不是"还能规避"的距离。
        radius: 0.44
        z_min: -0.20              # 盖到地面(-0.080)以下，确保轮子和底盘裙边都被剔掉
        z_max: 0.20               # 盖住 visual 网格顶面 0.1776，留 2cm 余量

      chain_names: ["torso", "head", "arm_left", "arm_right", "gripper_left", "gripper_right"]

      chains:
        # 躯干升降柱：从底盘原点一路到躯干末端
        torso:
          radius: 0.20
          frames:
            - "astribot_torso_base"
            - "astribot_torso_link_1"
            - "astribot_torso_link_2"
            - "astribot_torso_link_3"
            - "astribot_torso_link_4"
            - "astribot_torso_end_effector"

        # 头部（雷达/相机的安装区，容易被自己看到）
        head:
          radius: 0.18
          frames:
            - "astribot_head_base_link"
            - "astribot_head_link_1"
            - "astribot_head_link_2"

        # 左臂 7 自由度 + 工具端
        arm_left:
          radius: 0.15
          frames:
            - "astribot_arm_left_base_link"
            - "astribot_arm_left_link_1"
            - "astribot_arm_left_link_2"
            - "astribot_arm_left_link_3"
            - "astribot_arm_left_link_4"
            - "astribot_arm_left_link_5"
            - "astribot_arm_left_link_6"
            - "astribot_arm_left_link_7"
            - "astribot_arm_left_tool_link"

        # 右臂 7 自由度 + 工具端
        arm_right:
          radius: 0.15
          frames:
            - "astribot_arm_right_base_link"
            - "astribot_arm_right_link_1"
            - "astribot_arm_right_link_2"
            - "astribot_arm_right_link_3"
            - "astribot_arm_right_link_4"
            - "astribot_arm_right_link_5"
            - "astribot_arm_right_link_6"
            - "astribot_arm_right_link_7"
            - "astribot_arm_right_tool_link"

        # ===== 夹爪（2026-08-20 新增，修一个实测出来的导航彻底瘫掉的回归）=====
        #
        # !!! 不加这两条链的后果：整个导航与自主探索完全不可用 !!!
        # 上面两条臂链止于 *_tool_link，而 tool_link 与 link_7 **原点完全重合**
        # （tool_joint 的 xyz 是 0 0 0），所以那条链实际上到 link_7 就结束了。
        # Gate 1 给两臂装上真实夹爪之后，夹爪整体落在被剔除体积**之外**：
        # 实测 astribot_gripper_left_Link_L11 在本体系 (0.062, 0.415, 0.618)，
        # 而 /scan 与 /scan_from_cloud 在 ±90° 方向上出现 0.413m 的回波 ——
        # 机器人把自己的指尖当成了障碍物。
        #
        # 连锁反应（现场看起来完全不像自滤问题）：
        #   0.41m 处的障碍 -> 膨胀层把机器人**自己所在的格**标成
        #   INSCRIBED_INFLATED(代价 99/253) -> 全局规划器每次都报
        #     GridBased: failed to create plan, invalid use: Starting point in lethal space!
        #   -> 探索协调器每一个前沿候选都被"全局规划失败"丢弃
        #     （实测：原始前沿格 533、有效前沿块 2、候选 5 个，5/5 全丢）
        #   -> 状态机在 GEN_NEXT_POINT <-> VALIDATING 之间空转，机器人一步不动。
        # 症状指向"前沿点选得不好"，根因却在"点云自滤没跟上 URDF 的变化"。
        #
        # radius 0.10 是从几何算出来的，不是估的：逐个 link 量碰撞几何顶点到该 link
        # 原点的最大距离（含 collision origin 偏移与旋转），实测
        #   gripper_base 0.0911 / Link_L11 0.0676 / Link_R11 0.0676
        #   Link_L2 0.0547 / Link_R2 0.0547 / arm_link_7 0.0560
        # 取最大值 0.0911 再留约 1cm 余量 -> 0.10。
        #
        # frames 里同时列 L11 与 R11 两个指尖：两点之间的扫掠球会把**指缝**也一起
        # 剔掉。这是有意的取舍 —— 导航时两臂是收起的，指缝里不会有需要看见的障碍；
        # 而少剔一点的代价是整个规划瘫掉（就是上面这个回归）。
        # 将来要做"边走边抓"时需要重新评估这一条。
        gripper_left:
          radius: 0.10
          frames:
            - "astribot_arm_left_link_7"
            - "astribot_gripper_left_base"
            - "astribot_gripper_left_Link_L11"
            - "astribot_gripper_left_Link_R11"
            - "astribot_arm_left_tcp_link"

        gripper_right:
          radius: 0.10
          frames:
            - "astribot_arm_right_link_7"
            - "astribot_gripper_right_base"
            - "astribot_gripper_right_Link_L11"
            - "astribot_gripper_right_Link_R11"
            - "astribot_arm_right_tcp_link"
