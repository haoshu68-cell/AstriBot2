# =============================================================================
# 感知模块参数：3D 点云多层高度切片投影 → 2D LaserScan
#
# 用 `/**` 通配节点名，这样无论以独立进程还是组件方式加载、无论节点被
# 重命名成什么，参数都能正确匹配（每个 yaml 只会喂给对应的一个节点）。
#
# ！！！坐标系前提（务必先看这一段）！！！
#   本机器人**没有 base_link**。整机根坐标系是 astribot_torso_base
#   （运行时 TF 实测确认，Nav2 的 robot_base_frame 也用的是它）。
#   所有下面的 z 值都是「在 astribot_torso_base 系里的高度」，不是离地高度。
#
#   !!! 地面基准（这条曾经搞错过，后果是地面点漏进最低层变成幽灵障碍物）!!!
#   地面在该系里约为 z = -0.080m。两条独立证据互相印证：
#     · 几何计算：轮心离轴 0.306、球半径 0.080，轮子最低点 = -0.0805（从 URDF 算）
#     · 点云实测：融合点云在本系下的最小 z = -0.0794，最低 0.02m 档位有明显地面峰
#   换算：离地高度 = z + 0.080。
#
#   ⚠ 不要用 odom 报的静止高度 0.1292 去反推地面！那个值参考的不是 torso_base
#   （差 0.049m）。早期按 -0.129 配切片，导致 low_obstacle 下界正好压在地面上。
# =============================================================================
/**:
  ros__parameters:

    # ---------------- 话题与坐标系 ----------------
    # 输入用双雷达融合后的点云（livox_fusion_node 的输出）
    input_cloud_topic: "/livox/fused_points"
    output_scan_topic: "/scan_from_cloud"
    marker_topic: "~/debug_markers"
    base_frame: "astribot_torso_base"

    # ---------------- 时间与 TF 容错 ----------------
    tf_timeout_sec: 0.05          # TF 查询超时，超时即丢帧等 TF 恢复
    max_cloud_age_sec: 0.30       # 点云时间戳与当前时刻偏差上限
    tf_time_tolerance_sec: 0.10   # 点云时间戳与 TF 时间戳偏差上限，防时间错位造成假障碍

    # ---------------- 点云预处理 ----------------
    enable_voxel_filter: true
    voxel_leaf_size: 0.03         # 3cm 体素：仓储尺度下足够，且能把 Mid360 的点数降一个量级
    enable_outlier_filter: true
    outlier_mean_k: 12            # 统计离群点滤波近邻数
    outlier_stddev_mul: 2.0       # 标准差倍数，越小滤得越狠

    # ---------------- 有效性与异常策略 ----------------
    min_valid_points: 20          # 剔除自身点后不足该数量，本帧判为不可信（不是「前方无障碍」）
    watchdog_period_sec: 0.5
    input_timeout_sec: 1.0
    # hold_last  : 输入异常时重发上一帧有效 scan（只刷时间戳），避免 costmap 障碍物闪烁消失
    # stop_output: 干脆停发，让下游自己按传感器超时处理
    invalid_input_policy: "hold_last"

    # ---------------- 调试可视化 ----------------
    publish_markers: true
    marker_point_stride: 3        # Marker 点抽稀，1=全发（RViz 会很卡）

    # ---------------- 输出 LaserScan 的几何 ----------------
    scan:
      angle_min: -3.14159265
      angle_max: 3.14159265
      angle_increment: 0.0087     # 0.5°，约 722 束，和既有 pointcloud_to_laserscan 保持一致
      range_min: 0.35             # 小于该距离的点全部丢弃（本体附近交给自身剔除处理）
      range_max: 20.0
      scan_time: 0.1
      # range_max: 无障碍方向填最大距离（需求规定的默认行为）
      # infinity : 填 inf，与既有 pointcloud_to_laserscan 的 use_inf:=true 行为一致
      no_return_mode: "range_max"

    # =========================================================================
    # 多层高度切片（需求明确禁止单层切片，这里至少 2 层，程序会强制校验）
    #
    # 分层依据是「不同高度的障碍物对底盘运动的影响不同」：
    #   low_obstacle : 离地 5~25cm。托盘、踏板、纸箱底、地面杂物。
    #                  单层切片方案最容易漏的就是这一档——切在 0.3m 高度时，
    #                  一个 15cm 高的托盘完全不可见，但底盘会直接撞上去。
    #   main_nav     : 离地 25~68cm。货架立柱、墙面、大件障碍，导航主力层。
    #   torso_high   : 离地 68cm~1.18m。桌面、货架横梁、操作台。
    #                  底盘能过但躯干/手臂会撞，必须纳入代价地图。
    #   overhead     : 离地 1.18~1.63m。悬空横梁、门楣。撞头部/上躯干。
    #
    # 融合方式：同一角度桶跨层取最小距离，所以任意高度上最近的那个障碍物
    # 都会体现在最终 scan 上，不存在层间漏检。
    #
    # 每层两个「抗噪/抗误判」旋钮：
    #   min_points: 该角度桶内至少多少点才认账。贴地层给大一点，压制地面反光点。
    #   max_range : 该层的信任距离。贴地层在底盘俯仰时容易把远处地面看成障碍，
    #               所以只信近处；悬空层同理，远处的天花板不该进 costmap。
    # =========================================================================
    slice_names: ["low_obstacle", "main_nav", "torso_high", "overhead"]

    slices:
      low_obstacle:
        z_min: -0.03              # 离地 5cm：地面在 -0.080，向上留 5cm 余量把地面点排除
        z_max: 0.17               # 离地 25cm
        # 贴地层保留 2 个点的证据要求：这一层的误报是"幽灵障碍物"，
        # 会无谓地挡住通路；而且地面反光点恰好集中在这一层。
        min_points: 2
        max_range: 6.0            # 只信 6m 内，远处贴地点多为地面误判
        enabled: true
      main_nav:
        z_min: 0.17               # 离地 25cm
        z_max: 0.60               # 离地 68cm
        # !!! 导航主力层刻意用 min_points: 1 !!!
        # 实测对比 pointcloud_to_laserscan：min_points=2 时有 26 个真实障碍方向被压掉
        # （放开到 1 之后"只有单层看到"的束数 128 -> 102）。Livox 是非重复扫描、
        # 点很稀疏，远处一根细立柱在某个 0.5° 桶里可能只有 1 个点。
        # 在"减少碰撞"这个目标下，漏掉真实障碍物比多报一个噪点危险得多，
        # 所以这一层不要证据数门槛，抗噪交给上游 SOR 和体素滤波。
        min_points: 1
        max_range: 20.0           # 主力层放到全量程
        enabled: true
      torso_high:
        z_min: 0.60               # 离地 68cm
        z_max: 1.10               # 离地 1.18m
        # 同上：桌面/货架横梁这类"底盘能过但躯干会撞"的障碍不能漏
        min_points: 1
        max_range: 20.0           # 跟主力层一致，让全局代价地图也拿到远处结构
        enabled: true
      overhead:
        z_min: 1.10               # 离地 1.18m
        z_max: 1.55               # 离地 1.63m，超过整机高度的点不关心
        # 悬空层保留 2 个点：这里误报会凭空封住一条通路，
        # 而撞到悬空物的概率本身低于撞中间高度的障碍。
        min_points: 2
        max_range: 8.0
        enabled: true

    # =========================================================================
    # 自身点云剔除（底盘 + 双臂 + 躯干 + 头部）
    #
    # 两套机制配合：
    #   footprint: 以 base_frame 原点为轴的竖直圆柱，管底盘和轮子。
    #              它跟着 base_frame 走，底盘俯仰时圆柱一起倾斜，
    #              满足「适配底盘倾斜工况」——不是在固定高度上裁一刀。
    #   chains   : 连杆链。每条链上相邻两个 TF frame 连成一条线段，
    #              套上 radius 变成胶囊体（圆柱+两端半球）。
    #              每帧都用 TF 重新解算，所以机械臂摆到任何姿态，
    #              剔除体都精确跟着连杆走，不存在「静态裁剪」的漏剔/过剔。
    #
    # radius 调参原则：宁可略大也不要过小——漏剔会让机械臂在 costmap 里
    # 画出幽灵障碍物，直接把机器人自己困死；略微过剔的代价只是
    # 手臂正下方的一小块区域看不见，而那块区域本来也被手臂挡住了。
    # 但也别无脑放大：radius 超过 0.3 会开始吃掉手臂旁边的真实障碍物。
    # =========================================================================
    self_filter:
      footprint:
        enabled: true
        # 底盘真实水平外接半径 = 0.386m（轮心离轴 0.306 + 轮球半径 0.080，从 URDF 算），
        # 这里取 0.42 留一点余量，把轮子外缘和底盘裙边都盖住。
        radius: 0.42
        z_min: -0.20              # 盖到地面(-0.080)以下，确保轮子和底盘裙边都被剔掉
        z_max: 0.05               # 底盘上表面附近

      chain_names: ["torso", "head", "arm_left", "arm_right"]

      chains:
        # 躯干升降柱：从底盘原点一路到躯干末端
        torso:
          radius: 0.20
          frames:
            - "astribot_torso_base"
            - "astribot_torso_link_1"
            - "astribot_torso_link_2"
            - "astribot_torso_link_3"
            - "astribot_torso_link_4"
            - "astribot_torso_end_effector"

        # 头部（雷达/相机的安装区，容易被自己看到）
        head:
          radius: 0.18
          frames:
            - "astribot_head_base_link"
            - "astribot_head_link_1"
            - "astribot_head_link_2"

        # 左臂 7 自由度 + 工具端
        arm_left:
          radius: 0.15
          frames:
            - "astribot_arm_left_base_link"
            - "astribot_arm_left_link_1"
            - "astribot_arm_left_link_2"
            - "astribot_arm_left_link_3"
            - "astribot_arm_left_link_4"
            - "astribot_arm_left_link_5"
            - "astribot_arm_left_link_6"
            - "astribot_arm_left_link_7"
            - "astribot_arm_left_tool_link"

        # 右臂 7 自由度 + 工具端
        arm_right:
          radius: 0.15
          frames:
            - "astribot_arm_right_base_link"
            - "astribot_arm_right_link_1"
            - "astribot_arm_right_link_2"
            - "astribot_arm_right_link_3"
            - "astribot_arm_right_link_4"
            - "astribot_arm_right_link_5"
            - "astribot_arm_right_link_6"
            - "astribot_arm_right_link_7"
            - "astribot_arm_right_tool_link"
