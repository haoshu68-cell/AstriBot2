/**:
  ros__parameters:

    map_topic: "/map"                       # slam_toolbox 输出，transient_local QoS
    goal_topic: "/explore/goal_pose"        # geometry_msgs/PoseStamped
    status_topic: "/explore/status"         # std_msgs/String，状态机文本
    complete_topic: "/explore/complete"     # std_msgs/Bool，transient_local
    marker_topic: "~/debug_markers"
    map_frame: "map"
    robot_base_frame: "astribot_torso_base"

    tf_timeout_sec: 0.2
    planning_period_sec: 2.0     # 探索是低频决策，2s 一轮足够；太快会在机器人还没动时反复改目标
    map_timeout_sec: 10.0        # 地图超过该时长没更新则告警（但仍用旧图规划，不停机）

    goal_same_tolerance: 0.35    # 两次目标点距离小于该值即视为「同一个目标」
    robot_progress_tolerance: 0.15   # 两轮间位移超过该值即算有推进(m)
    max_same_goal_count: 3       # 目标不变且无推进连续 3 轮 → 加重惩罚并重新全局采样
    max_relaxation_level: 3      # 采不到点时最多放宽 3 级
    relaxation_scale: 0.6        # 每级把最小面积/最小距离/净空乘 0.6
    max_consecutive_failures: 5  # 连续 5 轮采不到点 → 告警并清空历史惩罚
    visit_history_limit: 50      # 历史访问记录上限，超出丢弃最旧的

    publish_markers: true

    search:
      occupied_threshold: 65
      free_threshold: 25

      obstacle_inflation_radius: 0.35
      min_obstacle_cluster_cells: 3   # 小于 3 格的孤立占据斑块视为 SLAM 噪声，预处理抹掉

      use_eight_connectivity: true
      min_frontier_cells: 12          # 0.05m/格 → 12 格约 0.6m 长的前沿才值得跑一趟
      gain_window_radius: 1.5         # 未知增益统计窗口半径(m)

      adaptive_sample_gain: 0.15
      min_samples_per_cluster: 1
      max_samples_per_cluster: 8
      required_clearance_radius: 0.35 # 候选点周围该半径内不能有膨胀障碍，等于机器人半径
      min_goal_distance: 0.8          # 太近的目标没意义（机器人还没走就到了），过滤
      max_goal_distance: 0.0          # <=0 表示不限制远距离目标

      weight_distance: 1.0
      weight_gain: 6.0
      weight_visit_penalty: 4.0
      visit_penalty_radius: 1.2       # 历史目标点 1.2m 内的候选才吃惩罚

      random_seed: 20260819           # 固定种子：采样可复现，便于对比调参效果
