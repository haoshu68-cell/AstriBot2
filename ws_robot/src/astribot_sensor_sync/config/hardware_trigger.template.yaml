# Design input only: NOT consumed by launch; no hardware is armed by this file.
schema: astribot.sensor_sync.hardware/1
hardware_enabled: false
backend: UNCONFIGURED
reference_clock_epoch: UNCONFIGURED
clock_source: UNCONFIRMED_PTP_OR_PPS
board_model: UNKNOWN
pulse:
  period_us: null
  width_us: null
  polarity: UNKNOWN
  voltage: UNKNOWN
  actual_edge_readback_required: true
streams:
  camera_external_trigger_candidates: [head_rgbd/color, head_rgbd/depth, head_stereo/left, head_stereo/right, torso_rgbd/color, torso_rgbd/depth, left_wrist_rgbd/color, left_wrist_rgbd/depth, right_wrist_rgbd/color, right_wrist_rgbd/depth]
  native_clock_sync_candidates: [lidar_front, lidar_back, imu]
requirements:
  capability_and_electrical_readback_before_arm: true
  hardware_timer_owned_by_board: true
  device_counter_association_required: true
  independent_color_depth_capability: true
  disable_pulses_on_control_lease_expiry: true
  preserve_raw_capture_timestamps: true
